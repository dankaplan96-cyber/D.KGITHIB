<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character Lookdev</title>
<style>html,body{margin:0;height:100%;background:#2a2f36;color:#eee;font:14px system-ui}#info{position:fixed;left:12px;top:10px}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/build/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }</script>
</head><body><div id="info"></div>
<script type="module">
// Turntable for judging the sculpted characters without any game effects.
import * as THREE from 'three';
import { createCharacter } from './src/game/characters.js';
const q = new URLSearchParams(location.search);
const names = (q.get('c') || 'twinsen,zoe,arthur,gilbert,mira,pippa,doran,xil,tim,lulu').split(',');
const anim = q.get('anim') || 'idle';
const r = new THREE.WebGLRenderer({ antialias: true });
r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.NeutralToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#9fb7c9');
scene.add(new THREE.HemisphereLight('#e8f2ff', '#5a6a4a', 1.4));
const sun = new THREE.DirectionalLight('#fff4e0', 2.4); sun.position.set(3, 6, 5); scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(20, 48), new THREE.MeshStandardMaterial({ color: '#7f9a5a' }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const cam = new THREE.PerspectiveCamera(q.get('fov') ? +q.get('fov') : 30, innerWidth / innerHeight, 0.05, 100);
const t0 = performance.now();
const rigs = names.map((n, i) => { const rig = createCharacter(n); rig.root.position.x = (i - (names.length - 1) / 2) * 1.0; scene.add(rig.root); return rig; });
document.getElementById('info').textContent = `built ${names.length} in ${(performance.now() - t0).toFixed(0)} ms`;
const span = names.length * 1.0;
const dist = +(q.get('dist') || Math.max(3.2, span * 1.5));
cam.position.set(0, +(q.get('cy') || 1.3), dist); cam.lookAt(0, +(q.get('ly') || 1.0), 0);
let last = performance.now();
const yaw = q.get('yaw') != null ? +q.get('yaw') : null;
window.lookdev = { rigs, render: (dt = 1 / 60) => { rigs.forEach((g) => { g.play(anim); g.update(dt, anim === 'walk' ? 1.4 : anim === 'run' ? 6.5 : 0); if (yaw != null) g.root.rotation.y = yaw; }); r.render(scene, cam); } };
function loop(t) { const dt = Math.min(0.05, (t - last) / 1000); last = t; if (yaw == null) rigs.forEach((g) => (g.root.rotation.y += dt * 0.4)); window.lookdev.render(dt); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script></body></html>
