   <div class="row"><span>גרסת נתונים / עדכון אחרון</span><span>${S.data.revision} · ${fmtDT(S.data.updatedAt)}</span></div>
   <div class="row"><span>תחנות פעילות</span><span>${S.stations}</span></div></div>
   <div class="toolbar" style="margin-top:10px"><button class="btn sm" data-act="syncNow">סנכרון עכשיו</button><button class="btn sm outline" data-act="pickFolder">החלפת תיקייה</button></div></div>
  <div class="card"><h3>גיבויים <span class="toolbar"><button class="btn sm" data-act="doBackup">גיבוי עכשיו</button><button class="btn sm outline" data-act="exportJson">⬇ הורדת קובץ גיבוי</button><button class="btn sm outline" data-act="importJson">⬆ שחזור מקובץ</button></span></h3>
   <p class="small muted" style="margin-top:0">גיבוי אוטומטי נשמר פעם ביום בתיקייה <span dir="ltr">backups\\</span> (נשמרים ${BACKUP_KEEP} אחרונים). לפני כל שמירה נשמר גם העותק הקודם.</p>
   <div id="backupList" class="list"><div class="empty">טוען…</div></div></div>
  ${isSysAdmin()?`<div class="card"><h3>קוד שחזור מנהל/ת</h3><p class="small muted" style="margin-top:0">${s.recovery?'קיים קוד שחזור. יצירת קוד חדש מבטלת את הקודם.':'<b style="color:var(--red)">לא הוגדר קוד שחזור!</b> מומלץ ליצור כעת.'}</p><button class="btn sm amber" data-act="newRecovery">יצירת קוד שחזור חדש</button></div>`:''}</div></div>`;
};
async function loadBackupList(){
  const el=$('#backupList');if(!el)return;
  try{const names=(await listBackups()).slice(0,12);el.innerHTML=names.length?names.map(n=>`<div class="row"><span class="small" dir="ltr">${esc(n)}</span><button class="btn sm outline" data-act="restoreBackup" data-name="${esc(n)}">שחזור</button></div>`).join(''):'<div class="empty">אין גיבויים עדיין</div>'}catch{el.innerHTML='<div class="empty">לא ניתן לקרוא את תיקיית הגיבויים</div>'}
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='settingsForm')return;e.preventDefault();
  const v=formValues(e.target),err=$('#setErr');err.classList.add('hidden');
  try{
    const wd=(v.workDays||[]).map(Number);if(!wd.length)throw new Error('יש לבחור לפחות יום עבודה אחד');if(!v.department)throw new Error('יש להזין שם מחלקה');
    await mutate((st,a)=>{if(!(a.role==='admin'||a.manager))throw new Error('נדרשת הרשאת מנהל/ת');Object.assign(st.settings,{department:v.department,defaultAllowance:Number(v.defaultAllowance)||0,warningThreshold:Math.max(1,Number(v.warningThreshold)||3),workDays:wd,excludeHolidays:v.excludeHolidays,publicView:v.publicView,publicShowNames:v.publicShowNames,sessionMinutes:Math.max(1,Number(v.sessionMinutes)||10)});audit(st,a,'settings_saved')});
    toast('ההגדרות נשמרו','ok');
  }catch(x){err.textContent=x.message;err.classList.remove('hidden')}
});
ACT.doBackup=async()=>{const n=await backupNow('manual');toast('נשמר גיבוי: '+n,'ok');loadBackupList()};
ACT.exportJson=async()=>{const t=await readText(FS.data,DATA_FILE);downloadFile(`גיבוי_חופשות_${todayISO()}.json`,t,'application/json')};
ACT.importJson=()=>{
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;let data;try{data=normalizeState(JSON.parse(await f.text()))}catch{toast('הקובץ אינו קובץ גיבוי תקין','err');return}
    if(!data.users.some(u=>u.role==='admin'))return toast('בקובץ אין חשבון מנהל/ת – השחזור בוטל','err');
    if(!await confirmBox(`לשחזר מהקובץ <b>${esc(f.name)}</b>?<br>${data.employees.length} עובדים · ${data.requests.length} בקשות · עדכון אחרון ${fmtDT(data.updatedAt)}<br><br>הנתונים הנוכחיים יגובו לפני השחזור.`,{ok:'שחזור',kind:'red'}))return;
    await restoreData(data,f.name);};
  inp.click();
};
ACT.restoreBackup=async d=>{
  let data;try{data=normalizeState(JSON.parse(await readText(FS.backups,d.name)))}catch{toast('קובץ הגיבוי פגום','err');return}
  if(!await confirmBox(`לשחזר את הגיבוי <span dir="ltr">${esc(d.name)}</span>?<br>${data.employees.length} עובדים · ${data.requests.length} בקשות · עדכון ${fmtDT(data.updatedAt)}<br><br>הנתונים הנוכחיים יישמרו כגיבוי לפני השחזור.`,{ok:'שחזור',kind:'red'}))return;
  await restoreData(data,d.name,!!d.anon);
};
async function restoreData(data,label,anonymous=false){
  if(anonymous){ // מסך שגיאה – הקובץ הראשי לא קריא; אין משתמש מחובר
    await acquireLock();
    try{const cur=await readText(FS.data,DATA_FILE);if(cur)await writeText(FS.backups,`vacation-manager_${todayISO()}_${Date.now()}_broken.json`,cur);data.revision=(data.revision||0)+1000;audit(data,null,'restored_from_backup',label);await writeText(FS.data,DATA_FILE,JSON.stringify(data))}finally{await releaseLock()}
    S.me=null;toast('השחזור הושלם','ok');await activate(FS.root);return;
  }
  try{await backupNow('pre-restore')}catch(e){if(!await confirmBox('לא ניתן היה לגבות את הנתונים הנוכחיים. להמשיך בכל זאת?',{kind:'red'}))return}
  await mutate((st,a)=>{if(a.role!=='admin')throw new Error('שחזור מותר למנהל/ת מערכת בלבד');const rev=st.revision;for(const k of Object.keys(st))delete st[k];Object.assign(st,clone(data));st.revision=rev;audit(st,a,'restored_from_backup',label)});
  toast('השחזור הושלם','ok');renderAll();
}
ACT.newRecovery=async()=>{
  if(!await confirmBox('ליצור קוד שחזור חדש? הקוד הקודם יפסיק לעבוד.',{ok:'יצירה',kind:'amber'}))return;
  const code=recoveryCode(),rec=await passwordRecord(normCode(code));
  await mutate((st,a)=>{if(a.role!=='admin')throw new Error('נדרשת הרשאת מנהל/ת מערכת');st.settings.recovery=rec;audit(st,a,'recovery_code_created')});
  showRecoveryCode(code,false);
};

/* ---- audit log (admin) ---- */
const AUDIT_LABELS={system_created:'הקמת מערכת',blank_system_created:'הקמת מערכת',login:'כניסה',password_set:'הגדרת סיסמה',password_changed:'שינוי סיסמה',password_reset:'איפוס סיסמה',admin_password_recovered:'שחזור סיסמת מנהל/ת',request_created:'בקשה חדשה',request_cancelled:'ביטול בקשה',cancel_requested:'בקשת ביטול',cancel_request_withdrawn:'חזרה מבקשת ביטול',request_approved:'אישור בקשה',request_rejected:'דחיית בקשה',bulk_approved:'אישור מרוכז',cancel_approved:'אישור ביטול',cancel_rejected:'דחיית ביטול',leave_added_by_admin:'הוספת חופשה ע״י מנהל/ת',leave_edited:'עריכת חופשה',leave_deleted:'מחיקת חופשה',employee_added:'הוספת עובד/ת',employees_imported:'ייבוא עובדים',bulk_import_employees:'ייבוא עובדים',employee_edited:'עריכת עובד/ת',employee_enabled:'הפעלת עובד/ת',employee_disabled:'השבתת עובד/ת',employee_deleted:'מחיקת עובד/ת',admin_added:'הוספת מנהל/ת',admin_enabled:'הפעלת מנהל/ת',admin_disabled:'השבתת מנהל/ת',settings_saved:'שמירת הגדרות',restored_from_backup:'שחזור מגיבוי',recovery_code_created:'קוד שחזור חדש'};
PAGES.audit=()=>{
  if(!isAdmin())return '';
  const q=S.auditQ.toLowerCase();
  const rows=S.data.audit.slice().reverse().filter(a=>!q||`${a.displayName} ${AUDIT_LABELS[a.action]||a.action} ${a.detail}`.toLowerCase().includes(q)).slice(0,400);
  return head('יומן פעולות','תיעוד מלא של כל שינוי במערכת – מי, מה ומתי',`<input class="input" style="width:220px" placeholder="🔎 חיפוש ביומן" value="${esc(S.auditQ)}" data-on="auditQ">`)+
  `<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>זמן</th><th>משתמש/ת</th><th>פעולה</th><th>פרטים</th></tr></thead><tbody>${rows.map(a=>`<tr><td class="nowrap small">${fmtDT(a.at)}</td><td>${esc(a.displayName)}</td><td>${esc(AUDIT_LABELS[a.action]||a.action)}</td><td class="small">${esc(a.detail||'')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">אין רשומות</td></tr>'}</tbody></table></div></div>`;
};
let auditT=null;
ON.auditQ=el=>{S.auditQ=el.value;clearTimeout(auditT);auditT=setTimeout(()=>{renderPage();const i=document.querySelector('[data-on=auditQ]');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)};

/* ---------------- start ---------------- */
window.addEventListener('error',ev=>{console.error(ev.error||ev.message)});
window.addEventListener('unhandledrejection',ev=>{console.error(ev.reason)});
window.addEventListener('beforeunload',()=>{if(busy)releaseLock()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow(false)});
boot();
</script>
</body>
</html>
