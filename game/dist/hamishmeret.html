<style>
/* המשמרת — interface layer, following the Bofi Man RPG window language (v43–v57). */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{color-scheme:dark;--ink:#091321;--surface:#122235;--surface-raised:#1c3046;--line:#3a5369;--paper:#edf3f5;--muted:#a3b4c5;--accent:#72d1ed;--gold:#e9c17c;--stripe:#e9c17c}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;color:var(--paper);font-family:Rubik,"Arial Hebrew","Noto Sans Hebrew","Segoe UI",Arial,sans-serif}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
body{user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted);font-size:13px;line-height:1.6}

/* ---------- container: always landscape (rotated on portrait phones) ---------- */
#game-container{position:relative;width:100%;height:100%;display:flex;flex-direction:column;background:#1e293b;overflow:hidden}
body.force-land.rotated #game-container{position:fixed;top:0;left:0;width:var(--vh,100vh);height:var(--vw,100vw);transform-origin:0 0;transform:translateX(var(--vw,100vw)) rotate(90deg)}

/* ---------- HUD ---------- */
#hud{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 12px;background:linear-gradient(180deg,#172536,#0d1928);border-bottom:1px solid #48556a;box-shadow:0 2px 12px #030b1440;z-index:10;font-weight:700}
body.on-title #hud,body.on-cutscene #hud{display:none}
.hud-vitals{display:flex;flex-direction:column;gap:3px;min-width:0}
.hud-name{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:11px;color:#cbd5e1}
.hud-name strong{font-size:13px;color:#fff}
.flow-chip,.coin-chip{padding:1px 7px;border-radius:999px;font-size:10px;border:1px solid rgba(251,146,60,.6);color:#fdba74;background:rgba(124,45,18,.25)}
.coin-chip{border-color:rgba(233,193,124,.6);color:#fde68a;background:rgba(120,78,12,.25)}
#save-mark{font-size:8px;color:#4ade80;opacity:0;transition:opacity .4s}
.hud-bars{display:flex;align-items:center;gap:6px}
.bar-tag{font-size:8px;letter-spacing:.05em;color:#94a3b8}
.mini-bar{width:96px;height:5px;border-radius:999px;overflow:hidden;background:#060e19;box-shadow:inset 0 0 0 1px #354356}
.mini-bar-fill{height:100%;width:0;background:linear-gradient(90deg,#d5ab62,#f1d49b);transition:width .4s ease-out}
.badge-row{display:flex;gap:2px;font-size:11px}
.badge-row i{font-style:normal;filter:grayscale(1) brightness(.5);opacity:.6}
.badge-row i.on{filter:none;opacity:1;text-shadow:0 0 8px #e9c17c88}
.badge-row.big{font-size:26px;gap:8px;justify-content:center;margin:8px 0}
.system-btn{background:#22374c;border:1px solid #627b91;border-radius:8px;box-shadow:0 2px 6px #03091250;color:var(--paper);padding:6px 12px;font-size:12px}
.system-btn:active{transform:translateY(1px);background:#34546e}
.menu-btn{border-radius:999px!important;background:#202c45!important;border-color:#64748b!important;min-width:76px;font-weight:700}
@media(hover:hover){.system-btn:hover{background:#2a455e;border-color:#8da7bc}}

/* ---------- screen ---------- */
#screen-area{position:relative;flex:1;min-height:0;min-width:0;background:#0b1220;overflow:hidden}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#quest-box{position:absolute;top:9px;right:9px;display:flex;gap:6px;align-items:flex-start;max-width:min(380px,56%);padding:5px 11px;background:rgba(8,13,24,.82);border:1px solid rgba(251,191,36,.7);border-radius:999px;font-size:11px;line-height:1.35;pointer-events:none;z-index:15;box-shadow:0 4px 14px #0006;zoom:var(--ui-zoom,1)}
#quest-box strong{color:#fbbf24}
#quest-text{color:#e2e8f0}
body.in-battle #quest-box,body.on-title #quest-box,body.on-cutscene #quest-box{display:none!important}
#loc-label{position:absolute;top:9px;left:9px;padding:6px 14px 6px 12px;background:linear-gradient(90deg,rgba(8,13,24,.85),rgba(8,13,24,0));border-right:3px solid var(--gold);opacity:0;pointer-events:none;z-index:14;text-align:right}
#loc-label b{display:block;font-size:15px;color:#fff}
#loc-label small{display:block;font-size:10px;color:var(--muted)}
#loc-label.show{animation:locIn 3.2s ease forwards}
@keyframes locIn{0%{opacity:0;transform:translateX(-14px)}10%,75%{opacity:1;transform:none}100%{opacity:0}}
body.in-battle #loc-label{display:none}
#skip-btn{position:absolute;left:10px;top:10px;z-index:16;display:none}
body.on-cutscene #skip-btn{display:block}

/* ---------- message box: dialogue (gold) and battle command box ---------- */
#msg{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(92%,660px);max-height:58%;overflow-y:auto;display:none;z-index:20;padding:10px 16px 12px;background:rgba(8,13,24,.95);border:2px solid #e9b44c;border-radius:12px;box-shadow:0 10px 30px #000a;zoom:var(--ui-zoom,1);overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#557085 transparent}
#msg.show{display:block;animation:msgIn .18s ease-out}
@keyframes msgIn{from{opacity:0;transform:translate(-50%,6px)}}
#msg.battle{left:8px;right:8px;bottom:6px;padding:7px 14px 8px;width:auto;transform:none;border:1px solid #71899c;border-right:4px solid var(--stripe);border-radius:9px;animation:none}
#msg.tall{max-height:80%}
#msg-name{display:inline-block;font-size:11px;font-weight:800;color:#1b1406;background:var(--gold);border-radius:6px;padding:1px 8px;margin-bottom:5px}
#msg-text{font-size:15px;line-height:1.6;white-space:pre-line;color:#fff;min-height:1.6em}
#msg.battle #msg-text{font-size:14.5px}
#msg.battle .chips{margin:3px 0 0}
#msg.battle #msg-opts{margin-top:5px}
#msg-next{position:absolute;left:12px;bottom:6px;color:#fbbf24;font-size:12px;animation:blink 1s ease-in-out infinite}
#msg.has-opts #msg-next{display:none}
@keyframes blink{50%{opacity:.25}}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px}
.chips span{font-size:11px;padding:2px 9px;border-radius:99px;background:#0d1b2b;border:1px solid #2b4258;color:var(--paper);line-height:1.5}
.chips .vit{border-color:#2d5b78;color:#bae6fd}
.chips .r2{border-color:#e9c17c;color:#fde68a;background:#2a2214}
.chips .r1{border-color:#4d6a82;color:#cbd5e1}
.chips .r0{color:#64748b;border-style:dashed}
.chips .lab{border-color:#9d4b7a;color:#fbcfe8;background:#2a1424}
#msg-opts{margin-top:8px}
#msg-opts.list{display:flex;flex-direction:column;gap:6px}
#msg-opts.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.opt{display:flex;align-items:center;gap:8px;text-align:right;width:100%;padding:8px 12px;background:#101f31;border:1px solid #385168;border-radius:8px;font-size:14px;line-height:1.45;color:var(--paper);transition:background .12s,border-color .12s,transform .08s}
.opt .o-txt{flex:1;min-width:0}
.opt .o-txt b{font-weight:600}
.opt small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.opt .o-ico{font-size:18px}
.opt .o-mark{font-weight:800;color:#64748b;font-size:13px}
.opt.sel{background:#1d3a55;border-color:#72d1ed;box-shadow:0 0 0 1px #72d1ed55 inset}
.opt.dis{opacity:.45;cursor:default}
.opt.gone .o-txt b{text-decoration:line-through}
.opt.right{background:#14532d;border-color:#4ade80}
.opt.wrong{background:#5b1d24;border-color:#f87171;animation:shake .3s}
.opt.locked{pointer-events:none}
.opt.r2 b{color:#fde68a}
.opt.back{background:transparent;border-style:dashed;justify-content:center}
.opt.gold{background:linear-gradient(150deg,#4a3a17,#2c2310);border-color:#c79a45}
.opt.gold.sel{border-color:#fde68a;box-shadow:0 0 0 1px #fde68a66 inset}
#msg-opts.grid .opt{flex-direction:column;justify-content:center;text-align:center;gap:1px;min-height:46px;padding:6px;background:linear-gradient(150deg,#20364c,#17283b);border-color:#465e73}
#msg-opts.grid .opt .o-ico{font-size:17px;line-height:1}
#msg-opts.grid .opt b{font-size:15px;font-weight:800}
#msg-opts.grid .opt.sel{background:linear-gradient(150deg,#1e4a66,#16354c);border-color:#72d1ed}
#msg-opts.grid .opt.gold{background:linear-gradient(150deg,#5a4519,#3a2c10);border-color:#c79a45}
#msg-opts.grid .opt.back{grid-column:1/-1;min-height:36px}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.conf-row{display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.conf{font-size:12px;padding:4px 12px;border-radius:99px;background:#0d1b2b;border:1px solid #385168;color:var(--muted)}
.conf.on{background:#3a2c10;border-color:#e9c17c;color:#fde68a;font-weight:700}

/* ---------- toast ---------- */
#ach-toast{position:fixed;bottom:14px;left:14px;transform:translateY(30px);opacity:0;pointer-events:none;display:flex;gap:10px;align-items:center;padding:8px 16px 8px 12px;border-radius:12px;border:1px solid var(--gold);background:linear-gradient(120deg,#2a2210f2,#14202ff2);box-shadow:0 10px 30px #0008,0 0 18px #e9c17c44;transition:opacity .35s,transform .35s cubic-bezier(.2,.8,.3,1.2);max-width:80%;z-index:60}
#ach-toast.show{opacity:1;transform:none}
#ach-toast .ach-ico{font-size:26px}
#ach-toast small{display:block;font-size:9px;color:var(--gold);letter-spacing:.04em}
#ach-toast b{display:block;font-size:14px;color:#fff}
#ach-toast em{display:block;font-size:10px;color:var(--muted);font-style:normal}
#ach-toast.mini{padding:6px 14px 6px 10px;border-color:#55708a;background:#0e1e30f2}
#ach-toast.mini .ach-ico{font-size:18px}
#ach-toast.mini b{font-size:12px}

/* ---------- panels ---------- */
#scrim{position:absolute;inset:0;z-index:39;display:none;background:rgba(3,8,16,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
body.panel-open #scrim{display:block}
.panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 24px));max-height:calc(100% - 20px);z-index:40;display:none;flex-direction:column;padding:12px 14px;background:linear-gradient(145deg,#172a3e,#0b1727);border:1px solid #728596;border-radius:14px;box-shadow:0 20px 60px #0009,inset 0 1px 0 #b2d6e820;animation:menuIn .2s ease-out}
.panel.wide{width:min(780px,calc(100% - 24px))}
@keyframes menuIn{from{opacity:0;transform:translate(-50%,-47%)}}
.panel-header{display:flex;align-items:center;gap:10px;padding:2px 2px 9px;margin-bottom:10px;border-bottom:1px solid #55708566;color:var(--gold)}
.panel-header>span:first-child{flex:1;font-weight:800;font-size:16px}
.x-btn{flex-shrink:0;width:34px;height:34px;border-radius:50%;border:1px solid #627b91;background:#1c3046;color:var(--paper);font-size:15px;display:flex;align-items:center;justify-content:center}
#panel-body{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#557085 #0b1727;zoom:var(--ui-zoom,1);padding-bottom:2px}
.panel-list{display:flex;flex-direction:column;gap:7px}
.panel-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;background:#101f31;border:1px solid #385168;border-radius:8px;font-size:14px;line-height:1.5}
.panel-item small{font-size:12px;color:var(--muted)}
.settings-row{flex-direction:column;align-items:stretch;gap:6px}
.settings-desc{font-size:11px;color:var(--muted)}
.diff-row{display:flex;flex-wrap:wrap;gap:6px}
.diff-opt{opacity:.75}
.diff-sel,.diff-opt.diff-sel{background:#2d667e!important;border-color:#8ad8ee!important;color:#f0fafc;opacity:1;font-weight:700}
.close-btn{align-self:flex-start;min-height:40px;padding:8px 16px;font-weight:700;background:#294059;color:var(--paper);border:1px solid #627b91;border-radius:8px}
.btn-main{padding:11px 26px;font-size:16px;font-weight:800;background:linear-gradient(180deg,#f1d49b,#d5ab62);border:1px solid #ffe5b5;border-bottom:4px solid #9a7434;border-radius:10px;color:#182331;box-shadow:0 5px 20px #02091566,inset 0 1px 0 #fff5}
.btn-main:active{border-bottom-width:1px;transform:translateY(2px)}
.btn-secondary{background:linear-gradient(180deg,#2b435b,#1c3047);color:var(--paper);border-color:#7b92a8;border-bottom-color:#14263a}
.danger-btn{background:#67313b!important;border-color:#be7480!important}
.menu-context{padding:8px 10px;border-inline-start:3px solid var(--gold);background:#09172780;border-radius:6px}
.menu-context small{color:var(--muted);font-size:11px}
.menu-context div{font-size:13px;line-height:1.5}
.game-menu-panel{width:min(640px,calc(100% - 24px))}
.game-menu-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.game-menu-card{display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:56px;padding:7px 6px;text-align:center;background:linear-gradient(150deg,#20364c,#17283b);border:1px solid #465e73;border-bottom:3px solid #09101f;border-radius:9px;color:#fff}
.game-menu-card b{font-size:13px}
.game-menu-card small{font-size:10px;color:var(--muted)}
.game-menu-card:focus,.game-menu-card:hover{background:#2a455e;border-color:#8da7bc}
.menu-footer{display:flex;justify-content:space-between;gap:12px;padding:4px 2px 0;color:#94a3b8;font-size:10px}
.menu-footer span:first-child{color:#fde68a;font-weight:800}
.journal-entry{background:#101f31;border:1px solid #385168;border-inline-start:3px solid var(--gold);padding:9px 11px;border-radius:8px;font-size:13px;line-height:1.65}
.journal-entry b{display:block;color:#fbbf24;margin-bottom:3px}
.journal-entry.warn{border-inline-start-color:#f87171}
.journal-entry.warn b{color:#fca5a5}
.journal-entry.sbar{border-inline-start-color:#38bdf8}
.journal-entry.sbar b{color:#7dd3fc}
.journal-entry.sbar i{display:inline-block;width:18px;font-style:normal;font-weight:900;color:#7dd3fc}
.pg-section{color:var(--gold);font-size:12px;margin:4px 2px 0;font-weight:700}
.pg-bar{height:7px;border-radius:99px;background:#060e19;box-shadow:inset 0 0 0 1px #2b4258;overflow:hidden;margin:6px 0 2px}
.pg-bar>div{height:100%;border-radius:99px}
.pg-ch{padding:10px 12px;border:1px solid #385168;border-radius:9px;background:#101f31;border-inline-start:4px solid #385168}
.pg-ch.current{border-inline-start-color:var(--gold);background:linear-gradient(90deg,#101f31,#1b2a3a)}
.pg-ch-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pg-ch-head b{font-size:14px}
.pg-sub{display:block;color:var(--muted);font-size:11px;line-height:1.45;margin-top:3px}
.pg-tag{font-size:10px;padding:2px 8px;border-radius:99px;border:1px solid #567089;color:var(--muted);white-space:nowrap;align-self:flex-start}
.pg-tag.done{border-color:#68cf9c;color:#9be8bf}
.pg-steps{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:5px}
.pg-steps span{font-size:11px;color:#8195a8}
.pg-steps span.ok{color:#bfe9d2}
.st-top{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:linear-gradient(120deg,#1d3550,#101f31);border:1px solid #4d6a82}
.st-top canvas{width:64px;height:64px;border-radius:10px;background:#16263a;border:1px solid #4d6a82}
.st-lv{text-align:center;min-width:56px}
.st-lv small{display:block;font-size:10px;color:var(--muted)}
.st-lv b{font-size:32px;color:var(--gold);line-height:1}
.st-meters{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.st-title{font-size:14px}
.st-meter{display:grid;grid-template-columns:86px 1fr auto;gap:8px;align-items:center;font-size:11px;color:var(--muted)}
.st-meter .pg-bar{margin:0}
.st-meter b{color:var(--paper);font-size:11px}
.st-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.st-stat{padding:8px 6px;border-radius:9px;background:#101f31;border:1px solid #385168;text-align:center}
.st-stat small{display:block;font-size:10px;color:var(--muted)}
.st-stat b{display:block;font-size:20px}
.st-stat em{display:block;font-size:9px;color:var(--gold);font-style:normal}
.st-chips{display:flex;flex-wrap:wrap;gap:5px}
.st-chips span{font-size:11px;padding:3px 9px;border-radius:99px;background:#0d1b2b;border:1px solid #2b4258}
.j-tabs{display:flex;gap:5px;flex-wrap:wrap}
.j-tabs .system-btn{padding:4px 10px;font-size:12px;min-height:30px}
.dl-card{display:flex;flex-direction:column;gap:7px;padding:10px 12px;border-radius:10px;border:1px solid #c2410c;background:linear-gradient(120deg,#3a1d0e,#101f31)}
.dl-card.done{border-color:#385168;background:#101f31}
.dl-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dl-head b{color:#fdba74;font-size:14px}
.dl-head small{color:var(--muted);font-size:11px}
.dl-body{display:flex;flex-direction:column;gap:3px;font-size:13px}
.tw-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tw-actions .btn-main{padding:9px 20px;font-size:14px}
/* shop (the reference's corner shop) */
.shop-wallet{background:#2a2214;border:1px solid #a8894f;border-radius:99px;padding:3px 12px;color:#fde68a;font-size:14px;align-self:center;white-space:nowrap}
.shop-counter{display:flex;gap:12px;align-items:flex-end;padding:8px;border-radius:12px;background:linear-gradient(120deg,#2b2140,#122235);border:1px solid #4d3f66}
.shop-face{width:74px;height:74px;border-radius:12px;border:2px solid #f472b6;flex-shrink:0;background:#1d2433}
.shop-bubble{position:relative;flex:1;background:#f8fafc;color:#0f172a;border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.5;min-width:0}
.shop-bubble b{display:block;color:#be185d;font-size:11px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.shop-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:start;padding:10px 10px 8px;border-radius:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--tint) 22%,#132235),#0d1a2a 70%);border:1px solid color-mix(in srgb,var(--tint) 45%,#2b4258);color:var(--paper)}
button.shop-card:hover,button.shop-card:focus{border-color:var(--tint);box-shadow:0 6px 18px #0006,0 0 0 1px var(--tint) inset}
.shop-ico{font-size:28px;line-height:1;filter:drop-shadow(0 3px 4px #0008)}
.shop-name{font-weight:800;font-size:13px}
.shop-name em{font-style:normal;font-size:10px;color:var(--gold);font-weight:600}
.shop-fx{font-size:10.5px;color:var(--muted);line-height:1.35}
.shop-price{position:absolute;top:8px;left:8px;background:#fde68a;color:#3a2a0a;font-weight:900;font-size:13px;padding:2px 9px;border-radius:99px}
.shop-card.poor .shop-price{background:#3a1d22;color:#fca5a5}
.shop-card.bought{animation:shopPop .5s ease}
@keyframes shopPop{30%{transform:scale(1.05);box-shadow:0 0 22px var(--tint)}}
/* debrief, badges, certificate */
.db-top{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid #4d6a82;background:linear-gradient(120deg,#1d3550,#101f31)}
.db-top.lose{border-color:#be7480;background:linear-gradient(120deg,#4a1f2a,#101f31)}
.db-top b{display:block;font-size:15px}
.db-top small{display:block;font-size:11px;color:var(--muted)}
.db-stars{font-size:24px;color:#fde047;white-space:nowrap;letter-spacing:2px}
.db-row{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:6px 10px;background:#0d1b2b;border-radius:7px;font-size:13px;line-height:1.5}
.db-row span{color:var(--gold);font-weight:700;font-size:12px}
.db-row b{font-weight:500}
.db-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.badge-hero{display:flex;gap:14px;align-items:center;padding:12px;border-radius:12px;background:linear-gradient(120deg,#2a2214,#101f31);border:1px solid #a8894f}
.badge-big{font-size:46px;filter:drop-shadow(0 0 12px #e9c17c88)}
.badge-hero b{display:block;font-size:18px;color:#fde68a}
.badge-hero small{color:var(--muted);font-size:12px}
.cert{text-align:center;padding:16px;border:2px solid var(--gold);border-radius:14px;background:radial-gradient(ellipse at top,#2a2214,#0b1727)}
.cert h2{font-size:28px;color:#fde68a;margin:6px 0}
.cert p{font-size:14px;line-height:1.7;margin:8px auto;max-width:520px}
.cert small{color:var(--muted)}
.pt-card{display:flex;gap:10px;align-items:center;margin:6px 0 2px}
.pt-face{width:60px;height:60px;border-radius:10px;border:1px solid #4d6a82;flex-shrink:0}
.pt-card b{display:block;font-size:14px}
.pt-card small{display:block;font-size:11px;color:var(--muted);line-height:1.4}
/* labdex */
.dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.dex-card{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 9px;border-radius:9px;background:#0d1b2b;border:1px solid #2b4258;text-align:start;color:#5d7287}
.dex-card small{font-size:9px;font-family:monospace}
.dex-card b{font-size:13px;direction:ltr}
.dex-card span{font-size:10px}
.dex-card.s1{color:#94a3b8;border-style:dashed}
.dex-card.s2{color:var(--paper);border-color:#9d4b7a;background:linear-gradient(150deg,#2a1424,#0d1b2b)}
.dex-card.s2 b{color:#fbcfe8}
.dex-entry{display:flex;gap:10px;align-items:center;justify-content:space-between}
.dex-range{display:flex;gap:8px;align-items:baseline}
.dex-range small{color:var(--muted);font-size:11px}
.dex-range b{font-size:22px;color:#fbcfe8;unicode-bidi:plaintext}
.dex-range span{font-size:12px;color:var(--muted);unicode-bidi:plaintext}
/* new game */
.ng-looks{display:flex;gap:10px}
.ng-look{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;background:#101f31;border:1px solid #385168;border-radius:10px}
.ng-look canvas{width:72px;height:88px}
.ng-name{display:flex;align-items:center;gap:8px;font-size:14px}
.ng-name input{flex:1;max-width:240px;padding:8px 10px;font-size:16px;background:#0d1b2b;border:1px solid #4d6a82;border-radius:8px;color:#fff}
.ng-diff{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.diff-card{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 8px;background:#101f31;border:1px solid #385168;border-radius:10px;text-align:center}
.diff-card span{font-size:24px}
.diff-card b{font-size:14px}
.diff-card small{font-size:10.5px;color:var(--muted);line-height:1.35}

/* ---------- title / boot ---------- */
.title-modal{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 16px 14px;background:linear-gradient(to bottom,rgba(6,9,20,0) 58%,rgba(6,9,20,.55) 80%,rgba(6,9,20,.85));transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
.title-modal.title-hidden{opacity:0;transform:translateY(26px);pointer-events:none}
body:not(.on-title) .title-modal{display:none}
.title-btns{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.title-btns .btn-main{min-width:160px}
.cont-sub{display:block;font-size:10px;font-weight:600;opacity:.75;margin-top:2px}
.title-tag{color:#94a3b8;font-size:11px;margin-top:8px;text-shadow:0 2px 6px #000}
.title-modal:not(.title-hidden) .title-btns>*{animation:btnIn .5s cubic-bezier(.2,.8,.2,1.2) both}
.title-modal:not(.title-hidden) .title-btns>*:nth-child(2){animation-delay:.12s}
.title-modal:not(.title-hidden) .title-btns>*:nth-child(3){animation-delay:.2s}
@keyframes btnIn{from{opacity:0;transform:translateY(12px)}}
#boot-gate{position:fixed;inset:0;z-index:410;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050409;color:#e8d7b0;cursor:pointer;transition:opacity .35s}
#boot-gate .gate-ring{width:54px;height:54px;border-radius:50%;border:2px solid rgba(249,214,122,.55);animation:gatePulse 1.8s ease-in-out infinite}
#boot-gate .gate-text{margin-top:18px;font-size:14px;letter-spacing:.06em;opacity:.8}
@keyframes gatePulse{0%,100%{transform:scale(.9);opacity:.45}50%{transform:scale(1.08);opacity:1}}

/* ---------- accessibility ---------- */
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body.hc .panel{background:#05090f;border-color:#e2e8f0}
body.hc .panel-item,body.hc .journal-entry,body.hc .pg-ch,body.hc .game-menu-card,body.hc .opt,body.hc #msg{background:#000;border-color:#cbd5e1;color:#fff}
body.hc small,body.hc .settings-desc,body.hc .pg-sub,body.hc .muted{color:#e2e8f0!important}
body.hc #quest-box{background:#000;border-color:#fde047}
body.hc #hud{background:#000}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
@media(max-height:380px){#msg-text{font-size:14px}.opt{padding:6px 10px;font-size:13px}#msg-opts.grid .opt{min-height:48px}.game-menu-card{min-height:46px}}
@media(max-width:560px){.game-menu-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.st-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mae-splash{position:fixed;inset:0;z-index:400;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 46%,#1c1628 0%,#0c0914 52%,#040308 100%);overflow:hidden;cursor:pointer;-webkit-user-select:none;user-select:none}
.mae-splash .mae-stage{position:relative;width:min(50vmin,280px);height:min(50vmin,280px)}
.mae-splash svg{width:100%;height:100%;overflow:visible}
.mae-ring{fill:none;stroke:url(#maeGold);stroke-width:7.5;stroke-linecap:round;stroke-dasharray:490;stroke-dashoffset:490;transform-origin:100px 100px;transform:rotate(-100deg);filter:url(#maeGlow)}
.mae-bristle{fill:none;stroke:#f9d67a;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:470;stroke-dashoffset:470;opacity:.55;transform-origin:100px 100px;transform:rotate(-96deg)}
.mae-bristle.b2{stroke-width:1;opacity:.35;transform:rotate(-104deg)}
.mae-ring2{fill:none;stroke:rgba(249,214,122,.25);stroke-width:1.2;stroke-dasharray:4 7;opacity:0;transform-origin:100px 100px}
.mae-l{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:62px;fill:#fff7e6;stroke:#f9d67a;stroke-width:.8;opacity:0}
.mae-under{fill:none;stroke:url(#maeGold);stroke-width:3;stroke-linecap:round;stroke-dasharray:90;stroke-dashoffset:90}
.mae-dot{fill:#f9d67a;opacity:0}
.mae-spl{fill:#f9d67a;opacity:0;transform-box:fill-box;transform-origin:center}
.mae-studio{margin-top:2.2vmin;color:#e8d7b0;font-family:'Segoe UI',Arial,sans-serif;font-size:min(3.4vmin,15px);font-weight:600;letter-spacing:.2em;opacity:0;direction:ltr;text-transform:uppercase}
.mae-drop{position:absolute;left:50%;top:-6%;width:12px;height:16px;margin-left:-6px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#f9d67a;opacity:0;box-shadow:0 0 12px rgba(249,214,122,.8)}
.mae-ripple{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid rgba(249,214,122,.7);opacity:0}
.mae-ripple.r2{border-color:rgba(249,214,122,.35)}
.mae-shine{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(105deg,transparent 35%,rgba(255,244,214,.18) 48%,rgba(255,255,255,.32) 50%,rgba(255,244,214,.18) 52%,transparent 65%);background-size:260% 100%;background-position:120% 0}
.mae-bloom{position:absolute;left:50%;top:50%;width:70%;height:70%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(249,214,122,.28),rgba(249,214,122,0) 70%);opacity:0}
.mae-dust{position:absolute;bottom:-4%;width:3px;height:3px;border-radius:50%;background:#f9d67a;opacity:0;box-shadow:0 0 6px rgba(249,214,122,.9)}
.mae-hint{position:absolute;bottom:4vmin;color:rgba(232,215,176,.35);font-size:11px;letter-spacing:.1em;opacity:0}
.mae-run .mae-drop{animation:maeDrop .5s cubic-bezier(.55,0,.9,.4) .05s forwards}
.mae-run .mae-ripple{animation:maeRipple 1.1s cubic-bezier(.2,.7,.3,1) .5s forwards}
.mae-run .mae-ripple.r2{animation-delay:.68s}
.mae-run .mae-ring{animation:maeRing 1.25s cubic-bezier(.65,0,.35,1) .62s forwards}
.mae-run .mae-bristle{animation:maeBristle 1.25s cubic-bezier(.65,0,.35,1) .68s forwards}
.mae-run .mae-bristle.b2{animation-delay:.74s}
.mae-run .mae-ring2{animation:maeRing2 2.6s ease-out 1.2s forwards}
.mae-run .mae-l{animation:maeLetter .55s cubic-bezier(.2,.9,.3,1.3) forwards}
.mae-run .mae-l.l1{animation-delay:1.55s}
.mae-run .mae-l.l2{animation-delay:1.7s}
.mae-run .mae-l.l3{animation-delay:1.85s}
.mae-run .mae-under{animation:maeUnder .5s ease-out 2.05s forwards}
.mae-run .mae-dot{animation:maeDot .5s ease-out 2.2s forwards}
.mae-run .mae-spl{animation:maeSpl .45s cubic-bezier(.2,.9,.3,1.4) forwards}
.mae-run .mae-spl.s1{animation-delay:1.84s}
.mae-run .mae-spl.s2{animation-delay:1.9s}
.mae-run .mae-spl.s3{animation-delay:1.96s}
.mae-run .mae-spl.s4{animation-delay:2.02s}
.mae-run .mae-studio{animation:maeStudio 1s cubic-bezier(.2,.8,.2,1) 2.1s forwards}
.mae-run .mae-bloom{animation:maeBloom 1.4s ease-out 2.1s forwards}
.mae-run .mae-shine{animation:maeShine 1.1s ease-in-out 2.55s forwards}
.mae-run .mae-dust{animation:maeDust 3.4s ease-out forwards}
.mae-run .mae-hint{animation:maeHint .6s ease 1.2s forwards}
.mae-out{animation:maeOut .55s ease forwards}
@keyframes maeDrop{0%{opacity:0;transform:translateY(0) scaleY(1.3)}15%{opacity:1}100%{opacity:1;transform:translateY(calc(50vh + 3vmin)) scaleY(1.1)}}
@keyframes maeRipple{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(34)}}
@keyframes maeRing{to{stroke-dashoffset:36}}
@keyframes maeBristle{to{stroke-dashoffset:60}}
@keyframes maeRing2{0%{opacity:0;transform:rotate(0) scale(.92)}30%{opacity:1}100%{opacity:.6;transform:rotate(40deg) scale(1)}}
@keyframes maeLetter{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
@keyframes maeUnder{to{stroke-dashoffset:0}}
@keyframes maeDot{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.4)}100%{opacity:1;transform:scale(1)}}
@keyframes maeSpl{0%{opacity:0;transform:scale(0)}100%{opacity:.9;transform:scale(1)}}
@keyframes maeStudio{0%{opacity:0;letter-spacing:.2em}100%{opacity:1;letter-spacing:.75em}}
@keyframes maeBloom{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}40%{opacity:1}100%{opacity:.35;transform:translate(-50%,-50%) scale(1.15)}}
@keyframes maeShine{0%{opacity:1;background-position:120% 0}100%{opacity:1;background-position:-40% 0}}
@keyframes maeDust{0%{opacity:0;transform:translate(0,0)}20%{opacity:.9}100%{opacity:0;transform:translate(var(--dx),-70vh)}}
@keyframes maeHint{to{opacity:1}}
@keyframes maeOut{to{opacity:0;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.mae-run *{animation-duration:.01s!important;animation-delay:0s!important}}
/* =====================================================================
   LIGHT THEME (v1.1) — a bright day-shift palette, right-aligned layout
   ===================================================================== */
:root{color-scheme:light;--ink:#16324a;--surface:#ffffff;--surface-2:#f2f7fb;--surface-3:#e7f0f6;--line:#c9d8e4;--line-2:#b3c6d6;--paper:#16324a;--muted:#5d7488;--accent:#0e8f86;--gold:#c27c0e;--gold-soft:#fff4dc;--teal-soft:#e2f5f2;--stripe:#e0a93b}
html,body{background:#eaf2f7;color:var(--ink)}
#game-container{background:#eaf2f7}
#screen-area{background:#dfeaf1}
/* HUD */
#hud{background:linear-gradient(180deg,#ffffff,#f1f7fb);border-bottom:1px solid #cfdde8;box-shadow:0 2px 10px #1d3b5a14;color:var(--ink)}
.hud-name{color:#47627a}
.hud-name strong{color:#0f2a40}
.bar-tag{color:#6b8296}
.mini-bar{background:#e3ecf3;box-shadow:inset 0 0 0 1px #c6d6e3}
.mini-bar-fill{background:linear-gradient(90deg,#f0b232,#f7d27a)}
.flow-chip{border-color:#f3a76a;color:#b4521a;background:#fff1e6}
.coin-chip{border-color:#e7c26f;color:#8a5b06;background:#fff7e3}
.badge-row i{filter:grayscale(1);opacity:.35}
.system-btn{background:#ffffff;border:1px solid #b9cbda;color:var(--ink);box-shadow:0 2px 6px #1d3b5a14}
.system-btn:active{background:#e8f2f8}
@media(hover:hover){.system-btn:hover{background:#f0f7fb;border-color:#8fb0c8}}
.menu-btn{background:#ffffff!important;border-color:#9fb8cb!important;color:var(--ink)}
/* overlays on the screen — right aligned */
#quest-box{top:9px;right:9px;left:auto;background:rgba(255,255,255,.94);border:1px solid #e0a93b;color:var(--ink);box-shadow:0 4px 14px #1d3b5a22}
#quest-box strong{color:#c27c0e}
#quest-text{color:#24425c}
#loc-label{top:auto;bottom:12px;left:auto;right:12px;text-align:right;background:linear-gradient(270deg,rgba(255,255,255,.95),rgba(255,255,255,0));border-right:4px solid #0e8f86;padding:6px 12px 6px 30px}
#loc-label b{color:#0f2a40}
#loc-label small{color:#5d7488}
#skip-btn{left:auto;right:10px}
#ach-toast{left:auto;right:14px;border-color:#e0a93b;background:linear-gradient(120deg,#fff8e8,#ffffff);box-shadow:0 10px 30px #1d3b5a33;color:var(--ink)}
#ach-toast small{color:#c27c0e}
#ach-toast b{color:#0f2a40}
#ach-toast em{color:#5d7488}
#ach-toast.mini{background:#ffffff;border-color:#b9cbda}
/* dialogue & command box */
#msg{background:rgba(255,255,255,.97);border:2px solid #e0a93b;box-shadow:0 10px 30px #1d3b5a33;color:var(--ink);text-align:right}
#msg.battle{border:1px solid #b9cbda;border-right:5px solid var(--stripe);background:rgba(255,255,255,.97)}
#msg-name{background:#0e8f86;color:#fff}
#msg-text{color:#13304a}
#msg-next{color:#c27c0e}
.chips span{background:#f2f7fb;border-color:#c9d8e4;color:#24425c}
.chips .vit{border-color:#8cc5e6;color:#0b5b86;background:#eaf6fd}
.chips .r2{border-color:#e0a93b;color:#8a5b06;background:#fff4dc;font-weight:700}
.chips .r1{border-color:#a9bfd0;color:#36536b}
.chips .r0{color:#8aa0b2}
.chips .lab{border-color:#e7a2c7;color:#9d2463;background:#fdeef6}
.opt{background:#f6fafd;border:1px solid #c9d8e4;color:var(--ink);text-align:right}
.opt small{color:#5d7488}
.opt .o-mark{color:#8aa0b2}
.opt.sel{background:#e2f5f2;border-color:#0e8f86;box-shadow:0 0 0 1px #0e8f8655 inset}
.opt.right{background:#dcf5e3;border-color:#22a35a;color:#0f4d29}
.opt.wrong{background:#fde4e4;border-color:#e05252;color:#7a1d1d}
.opt.gold{background:linear-gradient(150deg,#fff4dc,#ffe9b8);border-color:#e0a93b}
.opt.gold.sel{border-color:#c27c0e;box-shadow:0 0 0 1px #c27c0e66 inset}
.opt.back{background:transparent}
#msg-opts.grid .opt{flex-direction:row;justify-content:flex-start;text-align:right;gap:8px;padding:6px 12px;background:linear-gradient(150deg,#ffffff,#eef5fa);border-color:#c3d4e2}
#msg-opts.grid .opt .o-txt b{font-size:15px}
#msg-opts.grid .opt.sel{background:linear-gradient(150deg,#e9faf7,#d8f1ed);border-color:#0e8f86}
#msg-opts.grid .opt.gold{background:linear-gradient(150deg,#fff6e2,#ffe7b0);border-color:#e0a93b}
#msg-opts.grid .opt .o-ico{font-size:20px}
.conf{background:#f2f7fb;border-color:#c9d8e4;color:#47627a}
.conf.on{background:#fff4dc;border-color:#e0a93b;color:#8a5b06}
/* panels */
#scrim{background:rgba(40,70,95,.22)}
.panel{background:linear-gradient(160deg,#ffffff,#f4f9fc);border:1px solid #c3d4e2;box-shadow:0 20px 60px #1d3b5a40;color:var(--ink);text-align:right}
.panel-header{border-bottom:1px solid #d7e3ec;color:#0e7a72}
.x-btn{background:#f2f7fb;border-color:#b9cbda;color:var(--ink)}
.x-btn:hover{background:#e3eef6}
.panel-item,.journal-entry,.pg-ch,.st-stat,.dex-card,.diff-card,.ng-look,.slot-card{background:#f7fbfd;border-color:#d1dfe9;color:var(--ink)}
.journal-entry{border-inline-start-color:#e0a93b}
.journal-entry b{color:#b26c06}
.journal-entry.warn b{color:#b42f2f}
.journal-entry.sbar b,.journal-entry.sbar i{color:#0b6fa4}
.journal-entry.evid{border-inline-start-color:#0e8f86;background:#f1faf8}
.journal-entry.evid b{color:#0e7a72}
.menu-context{background:#f1faf8;border-inline-start-color:#0e8f86}
.menu-context small,.panel-item small,.pg-sub,.settings-desc,.muted,.st-stat small,.st-lv small,.diff-card small,.game-menu-card small{color:#5d7488}
.game-menu-card{background:linear-gradient(150deg,#ffffff,#eef5fa);border:1px solid #c6d6e3;border-bottom:3px solid #b7c9d8;color:var(--ink);text-align:right;align-items:flex-start;padding:7px 10px}
.game-menu-card:focus,.game-menu-card:hover{background:#e9faf7;border-color:#0e8f86}
.menu-footer{color:#5d7488}
.menu-footer span:first-child{color:#b26c06}
.btn-main{background:linear-gradient(180deg,#ffd982,#f2b544);border:1px solid #f0c060;border-bottom:4px solid #c98a1c;color:#3a2504;box-shadow:0 5px 16px #c98a1c33}
.btn-secondary{background:linear-gradient(180deg,#2fb3a8,#0e8f86);border-color:#36b8ad;border-bottom-color:#0a6c65;color:#fff}
.close-btn{background:#f2f7fb;border:1px solid #b9cbda;color:var(--ink)}
.danger-btn{background:#fde4e4!important;border-color:#e59a9a!important;color:#7a1d1d!important}
.diff-sel,.diff-opt.diff-sel{background:#e2f5f2!important;border-color:#0e8f86!important;color:#0b5f59!important}
.pg-bar{background:#e3ecf3;box-shadow:inset 0 0 0 1px #c9d8e4}
.pg-ch.current{border-inline-start-color:#e0a93b;background:linear-gradient(270deg,#fff8e8,#f7fbfd)}
.pg-tag{border-color:#b3c6d6;color:#5d7488}
.pg-tag.done{border-color:#4cbf7d;color:#1b7a44}
.pg-steps span{color:#7b90a3}
.pg-steps span.ok{color:#1b7a44}
.pg-section{color:#b26c06}
.st-top,.db-top,.badge-hero{background:linear-gradient(270deg,#e9faf7,#ffffff);border-color:#b9d9d4;color:var(--ink)}
.db-top.lose{background:linear-gradient(270deg,#fdecec,#ffffff);border-color:#e7a6a6}
.st-top canvas,.pt-face{background:#e7f0f6;border-color:#c3d4e2}
.st-lv b,.st-stat em{color:#b26c06}
.st-chips span{background:#f2f7fb;border-color:#c9d8e4}
.db-row{background:#f2f7fb}
.db-row span{color:#0e7a72}
.db-stars{color:#e0a10b}
.badge-hero b{color:#b26c06}
.badge-row.big i.on{text-shadow:0 0 10px #f2b54488}
.cert{background:radial-gradient(ellipse at top,#fff6e2,#ffffff);border-color:#e0a93b}
.cert h2{color:#b26c06}
.dl-card{background:linear-gradient(270deg,#fff1e6,#ffffff);border-color:#f3a76a}
.dl-card.done{background:#f7fbfd;border-color:#d1dfe9}
.dl-head b{color:#b4521a}
.shop-counter{background:linear-gradient(270deg,#fdeef6,#ffffff);border-color:#efc3dc}
.shop-face{background:#fff;border-color:#f472b6}
.shop-bubble{background:#ffffff;border:1px solid #efc3dc;color:#16324a}
.shop-wallet{background:#fff7e3;border-color:#e7c26f;color:#8a5b06}
.shop-card{background:linear-gradient(160deg,color-mix(in srgb,var(--tint) 16%,#ffffff),#ffffff 75%);border-color:color-mix(in srgb,var(--tint) 45%,#d1dfe9);color:var(--ink);text-align:right}
.shop-fx{color:#5d7488}
.shop-name em{color:#b26c06}
.shop-price{background:#f2b544;color:#3a2504}
.dex-card{color:#9aaebe;text-align:right;align-items:flex-start}
.dex-card.s1{color:#5d7488}
.dex-card.s2{background:linear-gradient(150deg,#fdeef6,#ffffff);border-color:#e7a2c7;color:var(--ink)}
.dex-card.s2 b{color:#9d2463}
.dex-range b{color:#9d2463}
.ng-name input{background:#ffffff;border-color:#b9cbda;color:var(--ink)}
.title-modal{background:linear-gradient(to bottom,rgba(255,255,255,0) 58%,rgba(255,255,255,.55) 82%,rgba(255,255,255,.85))}
.title-tag{color:#47627a;text-shadow:none}
#boot-gate{background:#f4f8fb;color:#0e7a72}
#boot-gate .gate-ring{border-color:rgba(14,143,134,.55)}
/* sources */
.srcs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;align-items:center}
a.src{font-size:11px;padding:2px 9px;border-radius:99px;background:#eaf6fd;border:1px solid #9cc9e6;color:#0b5b86;text-decoration:none;line-height:1.6}
a.src:hover{background:#d8eefb}
.evid-k{margin-top:4px;color:#0e5f59;font-size:12.5px}
.evid-g{font-size:12px;color:#0e7a72;font-weight:700;margin-bottom:2px}
ol.biblio{padding-inline-start:20px;display:flex;flex-direction:column;gap:5px;font-size:12px;line-height:1.5}
ol.biblio a{color:#0b5b86;text-decoration:none}
ol.biblio a:hover{text-decoration:underline}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #0e8f86;outline-offset:2px}
/* high contrast (light) */
body.hc .panel,body.hc .game-menu-panel,body.hc #msg{background:#fff;border-color:#000}
body.hc .panel-item,body.hc .journal-entry,body.hc .pg-ch,body.hc .game-menu-card,body.hc .opt{background:#fff;border-color:#000;color:#000}
body.hc small,body.hc .settings-desc,body.hc .pg-sub,body.hc .muted{color:#000!important}
body.hc #quest-box{background:#fff;border-color:#000}
body.hc #hud{background:#fff}

/* v1.2 — calmer screens: quest lives in the HUD, nothing floats over the room */
#hud{gap:12px}
#quest-box{position:static!important;flex:1;min-width:0;max-width:none!important;display:flex;align-items:center;gap:6px;padding:5px 12px;margin:0 6px;border-radius:999px;font-size:12px;box-shadow:none!important;background:#fff8e8!important;border:1px solid #f0c060!important}
#quest-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
body.in-battle #quest-box{display:none!important}
#loc-label{top:10px!important;bottom:auto!important;right:10px!important}
.hud-bars .badge-row{font-size:12px}
@media(max-width:700px){.hud-bars{display:none}#quest-box{font-size:11px}}
.ng-name input{font-size:16px}

/* battle box: step bar, guidance, two big actions + a quiet secondary row */
.bsteps{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin-bottom:5px}
.bsteps span{font-size:11px;padding:2px 9px;border-radius:99px;background:#f2f7fb;border:1px solid #d1dfe9;color:#7b90a3;white-space:nowrap}
.bsteps span.done{background:#dcf5e3;border-color:#7fd19f;color:#1b7a44}
.bsteps span.cur{background:#0e8f86;border-color:#0e8f86;color:#fff;font-weight:700}
.bsteps i{font-style:normal;color:#b3c6d6;font-size:11px}
.bhint{font-size:13.5px;font-weight:700;color:#0b5f59;background:#e9faf7;border:1px solid #b9e3dc;border-radius:8px;padding:5px 10px;margin:2px 0 4px}
.btags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:3px}
.btags span{font-size:11px;padding:1px 8px;border-radius:99px;background:#fff4dc;border:1px solid #f0c060;color:#8a5b06}
#msg-opts.grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:5px}
#msg-opts.grid .opt.primary{grid-column:span 2;min-height:50px}
#msg-opts.grid .opt.primary .o-txt b{font-size:16px}
#msg-opts.grid .opt.mini{min-height:34px;padding:4px 8px;justify-content:center;background:#f6fafd}
#msg-opts.grid .opt.mini .o-ico{font-size:15px}
#msg-opts.grid .opt.mini .o-txt{flex:0 1 auto}
#msg-opts.grid .opt.mini .o-txt b{font-size:13px;font-weight:600}
.conf-row{align-items:center}
.conf-l{font-size:12px;font-weight:700;color:#47627a}
.conf-n{font-size:10.5px;color:#7b90a3;flex-basis:100%}
#msg.battle .chips span{font-size:10.5px;padding:1px 8px}
.shop-card.poor .shop-price{background:#fde4e4;color:#9b1c1c}
.shop-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}

#msg-opts.grid .opt.primary{min-height:44px}
#msg-opts.grid .opt.mini{min-height:30px}
.bhint .btags{display:inline-flex;margin:0 8px 0 0;vertical-align:middle}
.bhint .btags span{font-weight:600}

/* v1.3 — the journey */
#quest-box{cursor:pointer}
#quest-box:hover{background:#fff1cc!important}
.jmap{width:100%;height:auto;aspect-ratio:700/150;flex-shrink:0;display:block;margin:2px 0 4px}
.jpath{fill:none;stroke:#d1dfe9;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 12}
.jpath.reach{stroke:#0e8f86;stroke-dasharray:none;opacity:.55}
.jn{cursor:pointer}
.jn .jr-bg{fill:#ffffff;stroke:#c9d8e4;stroke-width:3}
.jn .jr-ring{fill:none;stroke:#0e8f86;stroke-width:4;transform:rotate(-90deg)}
.jn.done .jr-bg{fill:#fff4dc;stroke:#e0a93b}
.jn.done .jr-ring{stroke:#e0a93b}
.jn.cur .jr-bg{fill:#e9faf7;stroke:#0e8f86;animation:jpulse 1.6s ease-in-out infinite}
.jn.locked{opacity:.55}
.jn.sel .jr-bg{stroke-width:5}
.jn .je{font-size:22px;text-anchor:middle}
.jn .jt{font-size:12px;font-weight:800;fill:#24425c;text-anchor:middle;font-family:Rubik,sans-serif}
.jn:focus{outline:none}.jn:focus .jr-bg{stroke:#c27c0e}
@keyframes jpulse{50%{stroke-width:6}}
.jdetail{display:flex;flex-direction:column;gap:6px;border-top:1px dashed #d1dfe9;padding-top:8px}
.ch-head{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:linear-gradient(270deg,#e9faf7,#fff8e8);border:1px solid #b9d9d4}
.ch-medal{width:58px;height:58px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle at 35% 30%,#fff,#ffe7b0 60%,#f2b544);border:3px solid #e0a93b;box-shadow:0 4px 12px #c98a1c44}
.ch-head small{display:block;font-size:11px;color:#0e7a72;font-weight:700}
.ch-head b{display:block;font-size:18px;color:#0f2a40}
.ch-head span{display:block;font-size:12.5px;color:#47627a;line-height:1.5;margin-top:2px}
.ch-goals{padding-inline-start:20px;display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.5}
.ch-goals li::marker{color:#0e8f86}
.ch-pts{display:flex;flex-wrap:wrap;gap:8px}
.ch-pts span{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px 3px 4px;border-radius:99px;background:#f7fbfd;border:1px solid #d1dfe9}
.ch-pts canvas{width:28px;height:28px;border-radius:50%;border:1px solid #c3d4e2}
.story-next{padding:9px 12px;border-radius:10px;background:#f1faf8;border:1px solid #b9e3dc;font-size:13px;line-height:1.6}
.story-next b{display:block;color:#0e7a72;margin-bottom:2px}
.story-next span{color:#47627a}
.story-next .jr{display:block;margin-top:3px;font-weight:700;color:#b26c06}

/* v1.4 — the team */
.tm-card{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:10px;background:#f7fbfd;border:1px solid #d1dfe9}
.tm-card canvas{width:56px;height:56px;border-radius:10px;background:#e9faf7;border:1px solid #b9d9d4;flex-shrink:0}
.tm-card b{display:block;font-size:14px;color:#0f2a40}
.tm-card small{display:block;font-size:11.5px;color:#47627a;margin-top:2px}
.tm-card.locked{opacity:.65}
.tm-card.locked canvas{filter:brightness(0) opacity(.25)}
.tm-meters{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;font-size:11px;color:#5d7488;margin:5px 0 2px;max-width:340px}
.tm-meters .pg-bar{margin:0}
.hof-team{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 8px}
.hof-team span{font-size:12px;padding:3px 10px;border-radius:99px;background:#fff;border:1px solid #e0a93b}

/* v1.5 — core expertise pillars */
.pl-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:4px 0 6px}
.pl-row small{font-size:11px;color:#5d7488}

דן מים, diabetes insipidus.","low":"עודף מים יחסית/איבוד Na: SIADH, משתנים, HF, cirrhosis, היפרגליקמיה ועוד.","geri":"היפונתרמיה יכולה להתבטא כנפילות, בלבול, ירידה תפקודית או פרכוסים; תרופות שכיחות הן thiazides ו־SSRIs.","pit":"תקן Na בהיפרגליקמיה ואל תתקן מהר מדי dysnatremia כרונית."},{"id":"k","name":"אשלגן","en":"K⁺","cat":"אלקטרוליטים","range":"~3.5–5.1","unit":"mmol/L","what":"אלקטרוליט קריטי לממברנת שריר ולמערכת ההולכה בלב.","high":"AKI/CKD, ACEi/ARB/MRA, acidosis, tissue breakdown, insulin deficiency; לעיתים hemolysis בדגימה.","low":"משתנים, שלשול/הקאות, insulin/β-agonists, alkalosis, Mg נמוך.","geri":"שילוב CKD + RAAS blockers + dehydration הוא pattern שכיח להיפרקלמיה.","pit":"K חריג מאוד מחייב ECG והערכת hemolysis/דגימה; K נמוך שלא מתקן → בדוק Mg."},{"id":"cl","name":"כלוריד","en":"Cl⁻","cat":"אלקטרוליטים","range":"96–106","unit":"mmol/L","what":"anion עיקרי בנוזל החוץ־תאי; משתתף במאזן חומצה־בסיס ונוזלים.","high":"normal-anion-gap acidosis, saline load, dehydration.","low":"הקאות/NG suction, metabolic alkalosis, diuretics.","geri":"עוזר להבין חומצה־בסיס ולא רק ״מלח״.","pit":"פרש יחד עם Na ו־HCO₃."},{"id":"co2","name":"ביקרבונט/CO₂ כולל","en":"HCO₃⁻ / Total CO₂","cat":"אלקטרוליטים","range":"22–29","unit":"mmol/L","what":"בכימיה מייצג בקירוב bicarbonate ומשמש להערכת המרכיב המטבולי של חומצה־בסיס.","high":"metabolic alkalosis או compensation ל־respiratory acidosis כרונית.","low":"metabolic acidosis או compensation ל־respiratory alkalosis.","geri":"שלשול, AKI, DKA, sepsis ותרופות יכולים לשנות HCO₃.","pit":"כימיה אינה ABG; כשמצב חמור חבר pH/PaCO₂."},{"id":"aniongap","name":"פער אניונים","en":"Anion Gap","cat":"אלקטרוליטים","range":"~8–12 ללא K","unit":"mmol/L","what":"חישוב: Na − (Cl + HCO₃). מייצג anions לא נמדדים ועוזר לסווג metabolic acidosis.","high":"lactate, ketoacidosis, renal failure, toxins ועוד.","low":"hypoalbuminemia, paraproteinemia או artifact.","geri":"אלבומין נמוך שכיח ועלול למסך AG גבוה.","pit":"תיקון מקובל לאלבומין: AGcorr ≈ AG + 2.5×(4−albumin g/dL)."},{"id":"bun","name":"אוריאה חנקנית","en":"BUN","cat":"כליות","range":"6–20","unit":"mg/dL","what":"תוצר פירוק חלבון שמופרש דרך הכליה; מושפע גם מפרפוזיה, צריכת חלבון, דימום GI וקטבוליזם.","high":"ירידה ב־GFR, dehydration/prerenal physiology, GI bleed, steroids/catabolism.","low":"תת־תזונה, מחלת כבד קשה, overhydration.","geri":"BUN יכול לעלות מאוד בהפרעה פרה־רנלית גם בלי פגיעה מבנית בכליה.","pit":"BUN/Cr >20 יכול לתמוך בפרה־רנלי אך אינו אבחנתי לבדו."},{"id":"creat","name":"קריאטינין","en":"Creatinine","cat":"כליות","range":"~0.6–1.3","unit":"mg/dL","what":"תוצר מטבוליזם שריר המשמש להערכת תפקוד כלייתי ולחישוב eGFR/CrCl.","high":"ירידה בפינוי כלייתי, AKI/CKD; לעיתים שריר/תרופות משפיעים.","low":"מסת שריר נמוכה, frailty, תת־תזונה.","geri":"קריאטינין “תקין” בזקן sarcopenic יכול למסך GFR ירוד ולכן מסוכן במינון תרופות.","pit":"trend ו־urine output חשובים; AKI מוגדר בשינוי מה־baseline, לא רק חציית נורמה."},{"id":"egfr","name":"קצב סינון מוערך","en":"eGFR","cat":"כליות","range":"G1 ≥90 · G2 60–89 · G3a 45–59 · G3b 30–44 · G4 15–29 · G5 <15","unit":"mL/min/1.73m²","what":"הערכה מחושבת של סינון כלייתי. משמשת לסיווג CKD יחד עם albuminuria והגורם.","high":"לא מדד “גבוה מדי” שימושי ברוב ההקשרים.","low":"ירידה ב־GFR; CKD דורש כרוניות/עדות נזק, לא תוצאה בודדת.","geri":"eGFR מושפע מגיל וממסת שריר. תרופות מסוימות משתמשות דווקא CrCl ולא eGFR.","pit":"אל תתייג CKD על סמך בדיקה אקוטית אחת; בדוק chronicity ו־albuminuria."},{"id":"ca","name":"סידן כולל","en":"Calcium","cat":"אלקטרוליטים","range":"8.5–10.2","unit":"mg/dL","what":"סידן כולל כולל fraction קשור לאלבומין. חיוני לשריר, עצב, עצם והולכה לבבית.","high":"hyperparathyroidism, malignancy, תרופות/תוספים, dehydration ועוד.","low":"vitamin D deficiency, CKD, hypoparathyroidism, Mg נמוך, hypoalbuminemia.","geri":"בלבול, עצירות, חולשה ונפילות יכולים להיות ביטוי להפרעות Ca.","pit":"באלבומין חריג שקול ionized calcium; נוסחת corrected Ca היא קירוב בלבד."},{"id":"mg","name":"מגנזיום","en":"Mg²⁺","cat":"אלקטרוליטים","range":"1.7–2.2","unit":"mg/dL","what":"חשוב להולכה לבבית, עצב־שריר ולוויסות K/Ca.","high":"לרוב renal failure או עומס תוספים/antacids/laxatives.","low":"שלשול, אלכוהול, PPI/diuretics, תת־תזונה, uncontrolled diabetes.","geri":"Mg נמוך מגביר סיכון להפרעות קצב ונפילות ויכול לגרום ל־K עקשן.","pit":"סרום תקין אינו מבטיח שמאגרי הגוף תקינים."},{"id":"phos","name":"זרחן","en":"Phosphate","cat":"אלקטרוליטים","range":"2.8–4.5","unit":"mg/dL","what":"קריטי ל־ATP, שריר, עצם וממברנות.","high":"CKD, cell breakdown, hypoparathyroidism, עומס phosphate.","low":"refeeding, אלכוהול, תת־תזונה, insulin shifts, hyperparathyroidism.","geri":"ב־refeeding syndrome ירידת phosphate יכולה לגרום לחולשת נשימה וקריסה.","pit":"במטופל תת־תזונה שמתחיל הזנה — עקוב גם Mg/K."},{"id":"glucose","name":"גלוקוז בצום","en":"Fasting glucose","cat":"מטבוליזם ואנדוקריני","range":"70–99 תקין · 100–125 טרום־סוכרת · ≥126 סוכרת*","unit":"mg/dL","what":"רמת הגלוקוז בדם אחרי צום של לפחות 8 שעות.","high":"diabetes, stress hyperglycemia, steroids, endocrine disorders.","low":"insulin/sulfonylurea, poor intake, renal failure, sepsis, adrenal/liver disease.","geri":"היפוגליקמיה היא סכנה מיידית לנפילות, delirium ופרכוסים; לעיתים צריך deintensification.","pit":"*אבחנת סוכרת דורשת קריטריונים/אימות לפי ההקשר, לא מספר בודד ללא תסמינים."},{"id":"hba1c","name":"המוגלובין מסוכרר","en":"HbA1c","cat":"מטבוליזם ואנדוקריני","range":"<5.7% תקין · 5.7–6.4% טרום־סוכרת · ≥6.5% סוכרת*","unit":"%","what":"משקף חשיפה ממוצעת לגלוקוז במשך בערך 2–3 חודשים, אך תלוי turnover של RBC.","high":"היפרגליקמיה כרונית.","low":"יכול להיות יעד טיפול או artifact במצבים של קיצור חיי RBC/דימום/המוליזה.","geri":"יעד טיפול אינו זהה לסף אבחנה; ב־frailty/limited life expectancy לעיתים יעד פחות אגרסיבי מתאים.","pit":"אנמיה, CKD, transfusion והמוגלובינופתיות יכולים לשבש קשר בין A1c לגלוקוז."},{"id":"ast","name":"אספרטט אמינוטרנספראז","en":"AST","cat":"כבד וחלבונים","range":"~8–33","unit":"U/L","what":"אנזים המצוי בכבד אך גם בשריר ורקמות אחרות.","high":"hepatocellular injury, muscle injury, ischemia ועוד.","low":"לרוב ללא משמעות.","geri":"AST עולה גם אחרי פגיעה שרירית/נפילה; חבר CK והקשר.","pit":"AST אינו “תפקוד כבד” אלא marker של פגיעה."},{"id":"alt","name":"אלנין אמינוטרנספראז","en":"ALT","cat":"כבד וחלבונים","range":"4–36","unit":"U/L","what":"אנזים שמקורו בעיקר בכבד ומשמש marker לפגיעה hepatocellular.","high":"hepatitis, ischemia, תרופות, steatotic liver ועוד.","low":"לרוב ללא משמעות.","geri":"ALT יכול להיות פחות דרמטי בזקן גם במחלה משמעותית; trend/context חשובים.","pit":"ALT/AST גבוהים אינם מודדים יכולת סינתטית של הכבד."},{"id":"alp","name":"פוספטזה בסיסית","en":"ALP","cat":"כבד וחלבונים","range":"40–129","unit":"U/L","what":"אנזים שמקורו בעיקר בדרכי מרה ובעצם.","high":"cholestasis/biliary obstruction או bone turnover (שבר מחלים, מחלת עצם).","low":"פחות שכיח; תת־תזונה/חסרים ועוד.","geri":"אחרי שבר ALP יכול לעלות ממקור עצם; GGT יכול לסייע בשאלת מקור כבד/מרה.","pit":"ALP גבוה אינו שווה אוטומטית “כבד”."},{"id":"ggt","name":"גמא־גלוטמיל טרנספראז","en":"GGT","cat":"כבד וחלבונים","range":"מעבדה־תלוי; לרוב ~9–48","unit":"U/L","what":"אנזים רגיש ל־cholestasis ולחשיפות שונות, אך פחות ספציפי.","high":"biliary disease, alcohol, תרופות/אנזים induction.","low":"לרוב ללא משמעות.","geri":"ALP + GGT שניהם גבוהים תומכים יותר במקור hepatobiliary מאשר עצם.","pit":"GGT מבודד אינו אבחנה."},{"id":"bili","name":"בילירובין כולל","en":"Total bilirubin","cat":"כבד וחלבונים","range":"0.1–1.2","unit":"mg/dL","what":"תוצר פירוק heme שעובר עיבוד והפרשה דרך הכבד והמרה.","high":"hemolysis, hepatocellular dysfunction, cholestasis/obstruction, Gilbert ועוד.","low":"לרוב ללא משמעות.","geri":"צהבת חדשה + ירידה תפקודית/בלבול דורשת הסתכלות על כבד, מרה, זיהום ותרופות.","pit":"פצל direct/indirect כשצריך להבין מנגנון."},{"id":"bilidir","name":"בילירובין ישיר","en":"Direct bilirubin","cat":"כבד וחלבונים","range":"<0.3","unit":"mg/dL","what":"החלק המצומד שעובד בכבד ומוכן להפרשה.","high":"cholestasis/obstruction או impaired excretion hepatocellular.","low":"ללא משמעות.","geri":"מוסיף מנגנון לבילירובין כולל גבוה.","pit":"Indirect predominance מכוון יותר ל־hemolysis/Gilbert."},{"id":"albumin","name":"אלבומין","en":"Albumin","cat":"כבד וחלבונים","range":"~3.4–5.4","unit":"g/dL","what":"החלבון העיקרי בפלזמה; מיוצר בכבד ומשפיע על oncotic pressure וקישור תרופות.","high":"לרוב hemoconcentration/dehydration.","low":"דלקת, מחלת כבד, nephrotic loss, protein-losing enteropathy, תת־תזונה ועוד.","geri":"אלבומין נמוך הוא לעיתים marker של מחלה/דלקת ושבריריות, לא “בדיקת תזונה” טהורה.","pit":"חצי־חיים ארוך; אינו מגיב מהר לשינוי תזונתי."},{"id":"protein","name":"חלבון כולל","en":"Total protein","cat":"כבד וחלבונים","range":"~6.0–8.3","unit":"g/dL","what":"Albumin + globulins.","high":"dehydration, gammopathy/inflammation.","low":"מחלת כבד, איבוד כלייתי/מעי, תת־תזונה.","geri":"פער גדול בין total protein לאלבומין יכול לרמז על globulin burden.","pit":"אם חשד ל־monoclonal gammopathy נדרשת electrophoresis ולא רק total protein."},{"id":"pt","name":"זמן פרותרומבין","en":"PT","cat":"קרישה","range":"11–13.5","unit":"sec","what":"בודק בעיקר את המסלול extrinsic/common ותלוי בגורמי קרישה שמיוצרים בכבד.","high":"warfarin, vitamin K deficiency, liver disease, factor deficiency/DIC.","low":"לרוב פחות שימושי קלינית.","geri":"במטופל מדמם חשוב לחבר PT/INR לתרופות, כבד, תזונה וספסיס.","pit":"PT משתנה בין שיטות; INR מאפשר סטנדרטיזציה ל־warfarin."},{"id":"inr","name":"יחס מנורמל בינלאומי","en":"INR","cat":"קרישה","range":"0.8–1.1 ללא warfarin","unit":"ratio","what":"נרמול של PT, בעיקר לניטור warfarin.","high":"קרישה איטית יותר; warfarin, כבד, חסר vitamin K ועוד.","low":"במטופל על warfarin עלול להעיד על תת־אנטיקואגולציה בהתאם ליעד.","geri":"נפילה/דימום + warfarin מחייבים להבין את ה־INR בהקשר; DOACs אינם מנוטרים ב־INR שגרתי.","pit":"יעד warfarin שכיח 2–3 אך תלוי התוויה; mechanical valves יכולים לדרוש יעד אחר."},{"id":"aptt","name":"זמן תרומבופלסטין חלקי מופעל","en":"aPTT / PTT","cat":"קרישה","range":"25–35","unit":"sec","what":"בודק בעיקר intrinsic/common pathways ומשמש במצבים מסוימים לניטור unfractionated heparin.","high":"heparin, factor deficiency, lupus anticoagulant, liver disease/DIC ועוד.","low":"פחות ספציפי ולעיתים acute-phase.","geri":"הארכה חדשה + דימום דורשת medication reconciliation מיידי.","pit":"טווח therapeutic של heparin תלוי assay/anti-Xa ופרוטוקול."},{"id":"fibrinogen","name":"פיברינוגן","en":"Fibrinogen","cat":"קרישה","range":"~200–400","unit":"mg/dL","what":"Factor I, חלבון שהופך ל־fibrin ויוצר את רשת הקריש; גם acute-phase protein.","high":"דלקת, הריון, מצבי prothrombotic.","low":"DIC/consumption, massive bleeding, liver failure, fibrinolysis.","geri":"בספסיס עם platelets יורדים + PT/aPTT מתארכים, fibrinogen נמוך מחזק DIC.","pit":"בשלב מוקדם של sepsis fibrinogen יכול להיות דווקא גבוה בגלל acute-phase response."},{"id":"ddimer","name":"די־דימר","en":"D-dimer","cat":"קרישה","range":"Assay-specific; לעיתים <500 FEU","unit":"ng/mL FEU","what":"תוצר פירוק fibrin; רגיש לתהליך קרישה/פירוק אך לא ספציפי ל־VTE.","high":"VTE, זיהום/דלקת, ממאירות, ניתוח/טראומה, גיל ועוד.","low":"בשילוב pretest probability נמוכה יכול לסייע לשלול VTE.","geri":"D-dimer עולה עם גיל ולכן false positives שכיחים; יש אסטרטגיות age-adjusted בהקשר מתאים.","pit":"לעולם לא מאבחנים DVT/PE רק בגלל D-dimer גבוה."},{"id":"crp","name":"חלבון C־ריאקטיבי","en":"CRP","cat":"דלקת ופרפוזיה","range":"לרוב <5–10","unit":"mg/L","what":"acute-phase protein שעולה בדלקת; מגיב מהר יחסית ויעיל בעיקר כ־trend.","high":"זיהום, דלקת, טראומה, ניתוח, ממאירות ועוד.","low":"לא שולל זיהום מוקדם או localized infection.","geri":"התגובה הדלקתית עלולה להיות פחות בולטת; קליניקה ו־trend קודמים.","pit":"CRP אינו אומר “חיידקי” לבדו."},{"id":"esr","name":"שקיעת דם","en":"ESR","cat":"דלקת ופרפוזיה","range":"מעבדה/גיל/מין תלוי","unit":"mm/hr","what":"מדד עקיף לדלקת המבוסס על שקיעת RBC; משתנה לאט יותר מ־CRP.","high":"דלקת כרונית, זיהום, autoimmune, אנמיה, גיל ועוד.","low":"לרוב פחות משמעותי.","geri":"ESR עולה עם גיל ולכן specificity נמוכה; trend והקשר חשובים.","pit":"אל תשתמש בערך יחיד כדי “להוכיח” זיהום."},{"id":"pct","name":"פרוקלציטונין","en":"Procalcitonin","cat":"דלקת ופרפוזיה","range":"Assay/context dependent; לרוב <0.1 נמוך","unit":"ng/mL","what":"biomarker שיכול לתמוך בהערכת זיהום חיידקי סיסטמי ובהחלטות antibiotic stewardship בהקשרים מוגדרים.","high":"זיהום חיידקי סיסטמי, shock/trauma משמעותי ועוד.","low":"מוריד הסתברות במצבים מסוימים אך אינו שולל מוקד מקומי/מוקדם.","geri":"לא מחליף אומדן sepsis או source control.","pit":"השתמש לפי פרוטוקול ו־trend, לא cutoff קשיח לכל מטופל."},{"id":"lactate","name":"לקטט","en":"Lactate","cat":"דלקת ופרפוזיה","range":"~0.5–2.0","unit":"mmol/L","what":"תוצר מטבולי שיכול לעלות כשייצור עולה או clearance יורד; משמש רמז ל־stress/hypoperfusion אך אינו “מד חמצן רקמתי” מושלם.","high":"shock/hypoperfusion, seizures, β-agonists, liver dysfunction, metabolic causes ועוד.","low":"לרוב ללא משמעות.","geri":"לקטט מוגבר + שינוי הכרה/oliguria/hypotension הוא signal לפרפוזיה לא מספקת; trend חשוב.","pit":"אל “תרדוף אחרי לקטט” עם נוזלים בלי להעריך fluid responsiveness והקשר."},{"id":"tsh","name":"הורמון מגרה תריס","en":"TSH","cat":"מטבוליזם ואנדוקריני","range":"0.4–4.8","unit":"µU/mL","what":"הורמון היפופיזרי שמווסת את בלוטת התריס; לרוב בדיקת הסקר הראשונה לתפקוד תריס.","high":"לרוב primary hypothyroidism (פרש עם FT4).","low":"hyperthyroidism, pituitary disease או non-thyroidal illness בהקשר מתאים.","geri":"בגיל >80 הגבול העליון עשוי להיות גבוה יותר בחלק מהמעבדות; overtreatment עלול להעלות AF ושברים.","pit":"מחלה אקוטית וביוטין יכולים לשבש תוצאות; אל תפרש TSH בלי FT4 והקשר."},{"id":"ft4","name":"תירוקסין חופשי","en":"Free T4","cat":"מטבוליזם ואנדוקריני","range":"0.8–1.9","unit":"ng/dL","what":"החלק החופשי של T4 הזמין לרקמות. משלים TSH בהערכת axis התריס.","high":"hyperthyroidism או מינון יתר של levothyroxine.","low":"hypothyroidism או central hypothyroidism בהתאם ל־TSH.","geri":"שינויים קטנים יכולים להשפיע על דופק, משקל, קוגניציה וחולשה.","pit":"פרש TSH+FT4 יחד; severe illness יכולה לגרום non-thyroidal illness."},{"id":"cortisol","name":"קורטיזול","en":"Cortisol","cat":"מטבוליזם ואנדוקריני","range":"תלוי שעה ושיטה","unit":"µg/dL","what":"הורמון סטרס אדרנלי עם קצב יממתי.","high":"סטרס פיזיולוגי, Cushing, תרופות/מצבים שונים.","low":"adrenal insufficiency אפשרית, אך cutoff תלוי assay/time.","geri":"hypotension + hyponatremia + hyperkalemia + היפוגליקמיה יכולים לעורר חשד לאי־ספיקה אדרנלית.","pit":"אין “נורמה” אחת לאורך היום; לעיתים נדרש stimulation test."},{"id":"ferritin","name":"פריטין","en":"Ferritin","cat":"ברזל ותזונה","range":"גבר 30–400 · אישה 13–150","unit":"ng/mL","what":"חלבון אגירת ברזל; רמה נמוכה משקפת היטב depletion של מאגרי ברזל.","high":"דלקת, כבד, malignancy, iron overload ועוד.","low":"חסר ברזל.","geri":"Ferritin “תקין/גבוה” בזמן דלקת אינו שולל חסר ברזל; חבר TSAT/CRP.","pit":"זה acute-phase reactant."},{"id":"iron","name":"ברזל בסרום","en":"Serum iron","cat":"ברזל ותזונה","range":"גבר 59–158 · אישה 37–145","unit":"µg/dL","what":"כמות הברזל המחזורי הקשור בעיקר ל־transferrin; משתנה במהלך היום.","high":"iron overload, hemolysis, liver disease ועוד.","low":"חסר ברזל או דלקת כרונית.","geri":"סרום iron לבדו חלש לאבחון; Ferritin + TIBC/transferrin + TSAT טובים יותר.","pit":"מושפע מצום ושעה."},{"id":"tibc","name":"קיבולת קשירת ברזל","en":"TIBC","cat":"ברזל ותזונה","range":"~150–500 (מין/מעבדה תלוי)","unit":"µg/dL","what":"הערכה לכמות transferrin הזמינה לקשור ברזל.","high":"שכיח בחסר ברזל.","low":"דלקת כרונית, מחלת כבד, תת־תזונה.","geri":"עוזר להבדיל חסר ברזל מ־anemia of inflammation.","pit":"יש לפרש יחד עם ferritin ו־TSAT."},{"id":"tsat","name":"סטורציית טרנספרין","en":"TSAT","cat":"ברזל ותזונה","range":"גבר 20–50 · אישה 15–45","unit":"%","what":"אחוז אתרי הקישור של transferrin שתפוסים בברזל.","high":"iron overload.","low":"זמינות ברזל נמוכה — absolute או functional iron deficiency.","geri":"ב־CKD/HF יכול להיות functional iron deficiency גם כש־ferritin לא נמוך.","pit":"פרש לפי מחלה ספציפית והנחיות טיפול."},{"id":"b12","name":"ויטמין B12","en":"Vitamin B12","cat":"ברזל ותזונה","range":"299–1054","unit":"pg/mL","what":"נחוץ לסינתזת DNA ולתפקוד נוירולוגי.","high":"תוספים, מחלות כבד/המטולוגיות ועוד; לרוב פחות הבעיה הקלינית.","low":"malabsorption, pernicious anemia, תזונה, metformin/PPI ועוד.","geri":"חסר יכול להתבטא בנוירופתיה, הפרעת שיווי משקל, קוגניציה ומאקרוציטוזיס — ולעיתים ללא אנמיה.","pit":"בגבולי/חשוד שקול methylmalonic acid לפי ההקשר."},{"id":"folate","name":"פולאט","en":"Folate","cat":"ברזל ותזונה","range":"2.7–17.0","unit":"ng/mL","what":"ויטמין הנדרש לסינתזת DNA ולייצור תאי דם.","high":"תוספים/תזונה; לרוב ללא משמעות.","low":"תזונה ירודה, malabsorption, אלכוהול, תרופות מסוימות.","geri":"חסר גורם macrocytosis אך אינו מסביר נוירופתיה אופיינית ל־B12.","pit":"לפני טיפול בפולאט בלבד, אל תפספס B12 deficiency."},{"id":"vitd","name":"ויטמין D 25-OH","en":"25-OH Vitamin D","cat":"ברזל ותזונה","range":"יעדים משתנים בין הנחיות/מעבדות","unit":"ng/mL","what":"הבדיקה המקובלת להערכת מאגרי vitamin D.","high":"עודף תוספים עלול לגרום hypercalcemia.","low":"חוסר חשיפה/תזונה, malabsorption, CKD/liver issues ועוד.","geri":"רלוונטי לעצם, שריר ונפילות אך טיפול צריך להיות לפי הקשר ולא “לרדוף מספר”.","pit":"אין cutoff אוניברסלי אחד לכל מצב."},{"id":"troponin","name":"טרופונין לבבי רגיש","en":"hs-Troponin","cat":"לב ובדיקות מיוחדות","range":"אין מספר אוניברסלי — 99th percentile של ה־assay","unit":"ng/L לרוב","what":"marker לפגיעה בשריר הלב. אבחנת MI דורשת rise/fall + עדות לאיסכמיה, לא רק ערך גבוה.","high":"ACS/MI, HF, tachyarrhythmia, sepsis, PE, CKD ועוד.","low":"ערכים סדרתיים מתחת לספי האלגוריתם יכולים לסייע לשלול ACS.","geri":"CKD ומחלות כרוניות יכולות לגרום baseline elevated; delta והקליניקה קריטיים.","pit":"אל תשווה מספרים בין assays שונים ואל תאבחן MI מטרופונין גבוה בלבד."},{"id":"bnp","name":"פפטידים נתריורטיים","en":"BNP / NT-proBNP","cat":"לב ובדיקות מיוחדות","range":"Cutoffs תלויי assay, גיל והקשר","unit":"pg/mL","what":"משתחררים בתגובה למתח בדופן הלב ומשמשים לתמיכה בהערכת HF.","high":"HF, AF, CKD, גיל, PE ועוד.","low":"ערך נמוך יכול להפחית הסתברות ל־HF בהקשר מתאים.","geri":"גיל, AF ו־CKD מעלים ערכים ולכן specificity יורדת.","pit":"לא מטפלים במספר; חבר congestion, echo, renal function ו־trend."},{"id":"ck","name":"קריאטין קינאז","en":"CK / CPK","cat":"לב ובדיקות מיוחדות","range":"~30–200, מין/מעבדה תלוי","unit":"U/L","what":"אנזים שריר; עולה בפגיעה בשריר skeletal ולעיתים cardiac.","high":"rhabdomyolysis, trauma/fall, seizures, statins, myositis ועוד.","low":"לרוב ללא משמעות.","geri":"נפילה ממושכת על הרצפה + CK גבוה + AKI risk הוא pattern חשוב.","pit":"Troponin עדיף לפגיעה myocardial; CK משמש יותר skeletal muscle/rhabdo."},{"id":"ldh","name":"לקטט דהידרוגנאז","en":"LDH","cat":"לב ובדיקות מיוחדות","range":"~140–280","unit":"U/L","what":"אנזים לא ספציפי שנמצא ברקמות רבות.","high":"hemolysis, tissue injury, malignancy, liver ועוד.","low":"לרוב ללא משמעות.","geri":"משמש כחלק מ־pattern, למשל hemolysis יחד עם bilirubin/haptoglobin/retic.","pit":"דגימה hemolyzed יכולה להעלות LDH באופן מלאכותי."},{"id":"lipase","name":"ליפאז","en":"Lipase","cat":"לב ובדיקות מיוחדות","range":"מעבדה־תלוי","unit":"U/L","what":"אנזים לבלב; שימושי באבחון pancreatitis בהקשר קליני.","high":"pancreatitis, renal failure ומצבים נוספים.","low":"לרוב פחות שימושי.","geri":"כאב בטן יכול להיות לא טיפוסי; lipase משמעותי במיוחד כשהוא >3× ULN עם סיפור מתאים.","pit":"ערך מוגבר לבדו אינו pancreatitis."},{"id":"ph","name":"pH עורקי","en":"ABG pH","cat":"גזים בדם","range":"7.35–7.45","unit":"","what":"מאזן כולל בין חומצה לבסיס.","high":"alkalemia.","low":"acidemia.","geri":"משמעותי במיוחד בהידרדרות נשימתית, sepsis, AKI/DKA.","pit":"התחל תמיד ב־pH לפני PaCO₂/HCO₃."},{"id":"paco2","name":"לחץ CO₂ עורקי","en":"PaCO₂","cat":"גזים בדם","range":"35–45","unit":"mmHg","what":"המרכיב הנשימתי של חומצה־בסיס ומשקף ventilation.","high":"hypoventilation / respiratory acidosis.","low":"hyperventilation / respiratory alkalosis.","geri":"ישנוניות ב־COPD יכולה להיות hypercapnia גם עם SpO₂ סביר.","pit":"SpO₂ אינה מודדת ventilation."},{"id":"hco3abg","name":"ביקרבונט בגז דם","en":"ABG HCO₃⁻","cat":"גזים בדם","range":"22–26","unit":"mmol/L","what":"המרכיב המטבולי של חומצה־בסיס.","high":"metabolic alkalosis או compensation ל־chronic respiratory acidosis.","low":"metabolic acidosis או compensation ל־respiratory alkalosis.","geri":"חבר למצב כלייתי, שלשול/הקאות, DKA/lactate.","pit":"בדוק האם compensation צפוי או שיש mixed disorder."},{"id":"pao2","name":"לחץ חמצן עורקי","en":"PaO₂","cat":"גזים בדם","range":"~80–100 בצעיר; יורד עם גיל","unit":"mmHg","what":"לחץ החמצן המומס בדם עורקי.","high":"תלוי FiO₂.","low":"hypoxemia עקב V/Q mismatch, shunt, diffusion, hypoventilation ועוד.","geri":"הטווח הצפוי יורד עם הגיל; פרש עם FiO₂ וקליניקה.","pit":"PaO₂ ו־SpO₂ קשורים אך אינם אותו מדד."},{"id":"choltotal","name":"כולסטרול כללי","en":"Total Cholesterol","cat":"שומנים","range":"רצוי <200","unit":"mg/dL","what":"סך הכולסטרול בדם. משמש כחלק מפרופיל הסיכון הקרדיווסקולרי ואינו מפורש לבדו.","high":"קשור לעלייה בסיכון טרשתי בהתאם להרכב LDL/HDL ולגורמי הסיכון הכוללים.","low":"לרוב אינו יעד טיפולי בפני עצמו; ערך נמוך מאוד עשוי להופיע בתת־תזונה/מחלה כרונית אך אינו אבחנתי.","geri":"במבוגר יש לחבר את המספר ל־ASCVD קיים, תוחלת תועלת, frailty, תפקוד, אינטראקציות וסבילות לטיפול.","pit":"זהו יעד רצוי כללי, לא ‘טווח נורמה’ שמחליט לבדו על טיפול."},{"id":"ldl","name":"כולסטרול LDL","en":"LDL-C","cat":"שומנים","range":"רצוי לרוב <100; יעד תלוי סיכון","unit":"mg/dL","what":"ליפופרוטאין הנושא כולסטרול לרקמות ומהווה גורם מרכזי בטרשת עורקים.","high":"מעלה סיכון ל־ASCVD; המשמעות תלויה בסיכון הבסיסי ובמחלה וסקולרית קיימת.","low":"בדרך כלל רצוי בהקשר מניעה קרדיווסקולרית; אין לפרש ‘נמוך’ כמחלה ללא הקשר.","geri":"במניעה שניונית גם בגיל מבוגר יש לעיתים תועלת משמעותית, אך החלטות צריכות לשלב frailty, adverse effects, goals ו־time-to-benefit.","pit":"LDL ‘מטרה’ אינה אחידה לכל אדם. אל תשתמש ב־100 כקו החלטה אוניברסלי."},{"id":"hdl","name":"כולסטרול HDL","en":"HDL-C","cat":"שומנים","range":"גבר >40 · אישה >50; ≥60 נחשב מיטבי","unit":"mg/dL","what":"ליפופרוטאין הקשור בהובלת כולסטרול חזרה לכבד. ערך גבוה יותר מקושר בדרך כלל לסיכון קרדיווסקולרי נמוך יותר.","high":"לרוב אינו בעיה כשלעצמו; ערכים קיצוניים אינם מבטיחים הגנה.","low":"קשור לסיכון קרדיווסקולרי מוגבר ולעיתים לתסמונת מטבולית.","geri":"אין ‘לטפל ב־HDL’ כיעד מבודד; ניהול הסיכון הכולל חשוב יותר.","pit":"HDL גבוה אינו מבטל LDL גבוה, עישון, סוכרת או מחלה וסקולרית."},{"id":"trig","name":"טריגליצרידים","en":"Triglycerides","cat":"שומנים","range":"רצוי <150","unit":"mg/dL","what":"שומנים בדם המושפעים מתזונה, סוכרת, אלכוהול, השמנה ותרופות.","high":"סוכרת לא מאוזנת, אלכוהול, תסמונת מטבולית, תרופות, hypothyroidism; ערכים גבוהים מאוד מעלים סיכון לפנקראטיטיס.","low":"לרוב חסר משמעות קלינית בפני עצמו.","geri":"בדוק תזונה, תרופות, גלוקוז ותירואיד לפני שמייחסים עלייה ‘לגיל’.","pit":"בדיקה לא בצום יכולה להעלות TG; הטיפול תלוי רמה והקשר ולא רק אם עבר 150."},{"id":"nonhdl","name":"כולסטרול שאינו HDL","en":"Non-HDL Cholesterol","cat":"שומנים","range":"רצוי לרוב <130; יעד תלוי סיכון","unit":"mg/dL","what":"Total cholesterol פחות HDL; כולל את כלל החלקיקים האתֶרוגניים העיקריים.","high":"מעיד על burden מוגבר של ליפופרוטאינים אתרוגניים.","low":"בדרך כלל רצוי בהתאם לסיכון הקליני.","geri":"יכול להיות שימושי במיוחד כשה־TG מוגברים; עדיין יש להתאים טיפול למצב הכולל.","pit":"זהו יעד סיכון ולא ‘בדיקת מחלה’ בפני עצמה."},{"id":"uricacid","name":"חומצה אורית","en":"Uric Acid","cat":"מטבוליזם ואנדוקריני","range":"אישה 3.0–7.1 · גבר 4.0–8.6","unit":"mg/dL","what":"תוצר פירוק purines המופרש בעיקר דרך הכליה.","high":"gout, CKD, dehydration, diuretics, tumor lysis ועוד; hyperuricemia לבדה אינה שווה התקף gout.","low":"פחות שכיח; יכול להופיע בתרופות/מצבים מטבוליים מסוימים.","geri":"משתנים ו־CKD שכיחים ולכן חשוב לחבר uric acid לתרופות ולתפקוד כלייתי.","pit":"במטופל שמטופל ב־gout יעד הטיפול לרוב נמוך מטווח המעבדה הכללי; אל תשנה טיפול לפי בדיקה יחידה ללא הקשר."},{"id":"serumosm","name":"אוסמולריות בסרום","en":"Serum Osmolality","cat":"אלקטרוליטים","range":"275–295","unit":"mOsm/kg","what":"ריכוז החלקיקים המומסים בפלזמה; מסייע בהערכת מאזן מים, dysnatremia, hyperglycemia והרעלות מסוימות.","high":"התייבשות/חסר מים, hypernatremia, hyperglycemia או osmoles חיצוניים.","low":"עודף מים יחסי כגון SIADH או מצבי hyponatremia היפואוסמולרית.","geri":"צמא ירוד, תרופות וירידה בתפקוד כלייתי מגבירים סיכון להפרעות מים.","pit":"ב־hyponatremia תמיד שאל מה ה־serum osmolality; לא כל Na נמוך הוא hypotonic hyponatremia."},{"id":"ica","name":"סידן מיונן","en":"Ionized Calcium","cat":"אלקטרוליטים","range":"4.8–5.6","unit":"mg/dL","what":"החלק הביולוגי הפעיל של הסידן שאינו קשור לחלבונים.","high":"hyperparathyroidism, malignancy ומצבים נוספים של hypercalcemia.","low":"critical illness, hypoparathyroidism, renal disease, citrate load, vitamin D disorders ועוד.","geri":"שימושי כשאלבומין חריג או במצב קריטי, שבהם total calcium עלול להטעות.","pit":"pH משפיע על ionized calcium; פרש יחד עם מצב חומצה־בסיס והקשר קליני."},{"id":"pth","name":"הורמון פאראתירואיד","en":"PTH","cat":"מטבוליזם ואנדוקריני","range":"~10–65","unit":"pg/mL","what":"הורמון המווסת calcium, phosphate ו־vitamin D; מפורש תמיד יחד עם סידן ותפקוד כלייתי.","high":"primary/secondary hyperparathyroidism, CKD, vitamin D deficiency ועוד.","low":"hypoparathyroidism או דיכוי עקב hypercalcemia מסיבות מסוימות.","geri":"חשוב בהערכת osteoporosis, hypercalcemia ו־CKD-mineral bone disorder.","pit":"PTH ‘בתוך הטווח’ יכול להיות בלתי מתאים אם calcium גבוה. תמיד פרש את הצמד PTH + calcium."},{"id":"ammonia","name":"אמוניה","en":"Ammonia","cat":"כבד וחלבונים","range":"~15–45","unit":"µg/dL","what":"תוצר חנקני רעיל שמסולק בעיקר דרך הכבד; יכול להצטבר באי־ספיקת כבד ובמצבים נוספים.","high":"hepatic failure/encephalopathy, GI bleed, renal failure, תרופות ומצבים מטבוליים מסוימים.","low":"בדרך כלל אינו בעל משמעות קלינית.","geri":"דליריום בחולה cirrhosis דורש differential רחב; ammonia גבוה תומך בהקשר אך אינו מסביר כל שינוי הכרה.","pit":"המספר לבדו אינו מדרג חומרת hepatic encephalopathy, והדגימה רגישה מאוד לטיפול והשהיה."},{"id":"haptoglobin","name":"הפטוגלובין","en":"Haptoglobin","cat":"ספירת דם","range":"41–165","unit":"mg/dL","what":"חלבון שקושר free hemoglobin; יורד כאשר יש hemolysis תוך־כלי משמעותי.","high":"acute-phase response ודלקת יכולים להעלות אותו.","low":"hemolysis, ולעיתים מחלת כבד בגלל ירידה בייצור.","geri":"באנמיה נורמוציטית לא מוסברת יכול לסייע כחלק מ־hemolysis panel יחד עם LDH, bilirubin ו־reticulocytes.","pit":"דלקת יכולה ‘להחזיק’ haptoglobin תקין/גבוה ולמסך hemolysis. לעולם לא לפרש לבד."},{"id":"amylase","name":"עמילאז","en":"Amylase","cat":"לב ובדיקות מיוחדות","range":"~40–140","unit":"U/L","what":"אנזים שמקורו בעיקר בלבלב ובבלוטות הרוק; יכול לעלות בפגיעה לבלבית ובמצבים נוספים.","high":"pancreatitis, salivary disease, renal impairment ומצבי בטן נוספים.","low":"לרוב פחות שימושי; יכול להופיע בפגיעה לבלבית כרונית משמעותית.","geri":"בחשד לפנקראטיטיס lipase בדרך כלל ספציפי ושימושי יותר; renal impairment יכול להשפיע על רמות האנזימים.","pit":"עמילאז מוגבר אינו אבחנה של pancreatitis בפני עצמו; חבר כאב/הדמיה/lipase והקשר."}]};

<script>
/* המשמרת — engine core: canvas frame, text, shapes, input, sound, effects.
   The frame follows the Bofi Man engine: a 480×320 logical play-frame that widens on
   landscape screens and grows taller on tall ones, drawn at devicePixelRatio. */
'use strict';

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const TILE = 40;
let VW = 480, VH = 320, dpr = 1, clock = 0;
const FONT_STACK = 'Rubik,"Arial Hebrew","Noto Sans Hebrew",Arial,"Segoe UI",sans-serif';

function resizeCanvas() {
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  if (cw > 0 && ch > 0 && cw / ch > 1.5) { VH = 320; VW = Math.min(760, Math.round(320 * cw / ch)); }
  else { VW = 480; VH = cw > 0 && ch > 0 ? Math.max(320, Math.min(900, Math.round(VW * ch / cw))) : 320; }
  // render scale = real screen pixels per logical pixel, so large screens stay sharp (capped to keep it fast)
  const real = cw > 0 ? cw / VW * (window.devicePixelRatio || 1) : (window.devicePixelRatio || 1);
  dpr = Math.max(1, Math.min(3, 2400 / VW, Math.ceil(real * 4) / 4));
  canvas.width = Math.round(VW * dpr);
  canvas.height = Math.round(VH * dpr);
}

/* ---------- math ---------- */
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t;
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }

/* ---------- text (RTL-aware, measured and fitted) ---------- */
function setFont(size, bold) { ctx.font = (bold ? '800 ' : '500 ') + size + 'px ' + FONT_STACK; }
function fitFont(text, maxWidth, size, bold, min) {
  let s = size; setFont(s, bold);
  while (s > (min || 8) && ctx.measureText(text).width > maxWidth) setFont(--s, bold);
  return s;
}
function heText(text, x, y, o) {
  o = o || {};
  const str = String(text == null ? '' : text);
  ctx.save();
  ctx.direction = o.ltr ? 'ltr' : 'rtl';
  ctx.textAlign = o.align || 'right';
  ctx.textBaseline = o.baseline || 'alphabetic';
  fitFont(str, o.maxWidth || 9999, o.size || 13, o.bold, o.minSize);
  if (o.shadow) { ctx.shadowColor = o.shadow; ctx.shadowBlur = o.shadowBlur || 6; ctx.shadowOffsetY = o.shadowY || 0; }
  ctx.globalAlpha *= o.alpha == null ? 1 : o.alpha;
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.strokeW || 3; ctx.strokeStyle = o.stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = o.color || '#fff';
  ctx.fillText(str, x, y);
  ctx.restore();
}
function numText(text, x, y, o) { heText(text, x, y, Object.assign({ align: 'left', ltr: true }, o)); }

/* ---------- shapes ---------- */
function roundRect(c, x, y, w, h, r) {

  'copd': { s: ['bts_o2_2017', 'gold2025'], k: 'BTS: ביעד SpO₂ של 88–92% במטופלים בסיכון ל-hypercapnia (חמצן “ללא יעד” מחמיר אותה). GOLD: NIV בהחמרת COPD עם pH ≤7.35 ו-PaCO₂ ≥45 mmHg.' },

  'hf-congestion': { s: ['hf2022', 'beers2023'], k: 'AHA/ACC/HFSA 2022: NSAIDs מחמירים אי-ספיקת לב ויש להימנע מהם; עלייה מהירה במשקל + orthopnea הם סימני גודש. Beers 2023: להימנע מ-NSAIDs ב-HF.' },

  'hyperk': { s: ['ukka_k'], k: 'UKKA: עם שינויי ECG — calcium IV להגנה על הממברנה מיד; insulin-glucose להעברת K לתאים (עם ניטור גלוקוז בגלל היפוגליקמיה); אחר כך סילוק ובדיקה חוזרת.' },
  'hypona': { s: ['spasovski2014', 'beers2023'], k: 'הנחיה אירופית 2014: בהיפונתרמיה כרונית — תיקון של עד 10 mmol/L ב-24 השעות הראשונות ועד 8 בכל יממה נוספת (סיכון ל-osmotic demyelination). תסמינים קשים: 3% saline 150 mL בבולוס. Thiazide ו-SSRI הם גורמים שכיחים (Beers).' },
  'hypoglycemia': { s: ['ada2025'], k: 'ADA 2025: יעד A1c <7.0–7.5% במבוגר בריא יחסית ו-<8.0% במורכבות/שבריריות; אחרי היפוגליקמיה — deintensification והימנעות מ-sulfonylureas ואינסולין אינטנסיבי כשאפשר.' },

/* ---------- mastery ---------- */
const Core = {
  episodes(p) { return C.episodes.filter(e => epPillars(e).includes(p)); },
  items(p) { return KNOW.filter(k => k.p === p); },
  record(id, ok) {
    const r = S.know[id] || (S.know[id] = { n: 0, ok: 0, last: 0 });
    r.n++; if (ok) r.ok++; r.last = S.shift; r.miss = ok ? 0 : (r.miss || 0) + 1;
  },
  mastered(id) { const r = S.know[id]; return !!(r && r.ok >= 1 && !r.miss); },
  // 50% the cases in that pillar (stars), 50% knowledge checks answered right the last time
  mastery(p) {
    const eps = this.episodes(p), its = this.items(p);
    const ep = eps.length ? eps.reduce((s, e) => s + ((S.episodes[e.id] || {}).stars || 0), 0) / (eps.length * 3) : 0;
    const kn = its.length ? its.filter(k => this.mastered(k.id)).length / its.length : 0;
    return Math.round((ep * .5 + kn * .5) * 100);
  },
  level(m) { return m >= 90 ? 'מומחה/ית' : m >= 70 ? 'מיומן/ת' : m >= 40 ? 'מתקדם/ת' : m >= 15 ? 'מתחיל/ה' : 'טרם נבדק'; },
  weakest() { return PILLAR_ORDER.slice().sort((a, b) => this.mastery(a) - this.mastery(b))[0]; },
  overall() { return Math.round(PILLAR_ORDER.reduce((s, p) => s + this.mastery(p), 0) / PILLAR_ORDER.length); },
  // spaced retrieval: unseen and missed items first, then the ones seen longest ago
  pickItem(p) {
    const pool = KNOW.filter(k => !p || k.p === p);
    const score = k => { const r = S.know[k.id]; if (!r) return 0; if (r.miss) return 1; return 2 + Math.max(0, 4 - (S.shift - r.last)) + Math.random(); };
    return pool.slice().sort((a, b) => score(a) - score(b) + (Math.random() - .5) * .8)[0];
  },
  chips(e) { return epPillars(e).map(p => `<span class="pl-chip" style="--pc:${PILLARS[p].color}">${PILLARS[p].icon} ${PILLARS[p].name}</span>`).join(''); },
  // mixed council/drill question list: knowledge items and decision stages from the pillar's cases
  questions(p, n, maxAct) {
    const its = shuffle(KNOW.filter(k => !p || k.p === p));
    let eps = (p ? this.episodes(p) : C.episodes).filter(e => maxAct == null || e.a <= maxAct);
    if (!eps.length) eps = p ? this.episodes(p) : C.episodes;
    eps = shuffle(eps);
    const out = [];
    for (let i = 0; out.length < n; i++) out.push(i % 2 === 0 ? { k: its[(i / 2) % its.length] } : { e: eps[i % eps.length], st: STAGES[(i + 1) % 4] });
    return out;
  },
};

CORE_EPISODES.forEach(e => { EP_PILLARS[e.id] = e.pl; if (!C.episodes.some(x => x.id === e.id)) C.episodes.push(e); });

<script>

/* ---------- panels (the reference's window language: header ✕, dimmed world) ---------- */
const Panel = {

<script>
/* המשמרת — battles: the clinical encounter as a Gen-3 style fight.

'use strict';

let battle = null;
const disp = { ehp: 1, ehpG: 1, hp: 1, hpG: 1, ap: 1 };

const DIFF = {
  learner: { name: 'מתלמד/ת', wrong: 12, sure: 16, noise: 3, start: 100, time: 100 },
  normal: { name: 'רגיל', wrong: 18, sure: 26, noise: 5, start: 100, time: 80 },
